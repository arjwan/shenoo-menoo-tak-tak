<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>الإشعارات | شنو منو تك تك</title><link rel="stylesheet" href="taktak-feed.css?v=20260909-1"><style>.notifications-shell{max-width:760px;margin:78px auto 90px;padding:14px}.notifications-head,.notification-card{background:var(--card,#111522);border:1px solid #26352f;border-radius:20px;padding:14px}.notifications-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.notifications-head a,.notifications-head button{color:inherit;text-decoration:none;background:#182821;border:1px solid #2d4138;padding:9px 12px;border-radius:12px;cursor:pointer}.notification-card{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;text-decoration:none;color:inherit}.notification-card.unread{border-color:#19d9a0;box-shadow:0 0 0 1px #19d9a033}.notification-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#19d9a0;color:#04110d;font-weight:800;flex:0 0 auto}.notification-avatar img{width:100%;height:100%;object-fit:cover}.notification-body{flex:1}.notification-body strong{display:block}.notification-body p{margin:5px 0}.notification-body small{opacity:.7}.empty{text-align:center;padding:50px 16px;background:var(--card,#111522);border-radius:20px}@media(max-width:700px){.notifications-shell{margin-top:66px;padding:8px}}</style></head><body><script src="auth-guard.js"></script><main class="notifications-shell"><section class="notifications-head"><a href="taktak.html">← الرئيسية</a><div><strong>🔔 الإشعارات</strong><div id="count" style="font-size:12px;opacity:.7"></div></div><button id="readAll" type="button">قراءة الكل</button></section><section id="list"><div class="empty">جارٍ تحميل الإشعارات...</div></section></main><nav class="mobile-bar"><a href="taktak.html"><b>⌂</b>الرئيسية</a><a href="stories.html"><b>✨</b>القصص</a><a href="reels.html"><b>▶</b>الريلز</a><a href="notifications.html"><b>🔔</b>الإشعارات</a><a href="profile.html"><b>👤</b>حسابي</a></nav><script>(()=>{'use strict';const API='https://shino-mino-tak-tak.duckdns.org',token=localStorage.getItem('token')||sessionStorage.getItem('token')||'',list=document.getElementById('list'),count=document.getElementById('count');const esc=v=>String(v||'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])),abs=u=>!u?'':/^https?:/i.test(u)?u:API+u;async function api(p,o={}){o.headers=Object.assign({Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'},o.headers||{});const r=await fetch(API+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'تعذر تنفيذ الطلب');return d}function card(n){const a=n.actor||{},pic=a.avatarUrl?'<img src="'+esc(abs(a.avatarUrl))+'" alt="">':esc((a.fullName||a.username||'?').slice(0,1));return '<a class="notification-card '+(!n.readAt?'unread':'')+'" data-id="'+esc(n.id)+'" href="'+esc(n.href||'taktak.html')+'"><span class="notification-avatar">'+pic+'</span><div class="notification-body"><strong>'+esc(a.fullName||a.username||'شنو منو')+'</strong><p>'+esc(n.text||'لديك إشعار جديد')+'</p><small>'+new Date(n.createdAt).toLocaleString('ar-IQ')+'</small></div></a>'}async function load(){try{const d=await api('/api/social/notifications');count.textContent=d.unread?d.unread+' غير مقروء':'لا توجد إشعارات غير مقروءة';list.innerHTML=(d.notifications||[]).length?d.notifications.map(card).join(''):'<div class="empty">لا توجد إشعارات بعد.</div>'}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}list.onclick=async e=>{const c=e.target.closest('[data-id]');if(!c)return;e.preventDefault();try{await api('/api/social/notifications/'+c.dataset.id+'/read',{method:'PATCH'});}catch(_){}location.href=c.href};document.getElementById('readAll').onclick=async()=>{try{await api('/api/social/notifications/read-all',{method:'PATCH'});await load()}catch(e){alert(e.message)}};load()})();</script></body></html>
