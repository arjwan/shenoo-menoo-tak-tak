<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070910"><title>المجموعات | شنو منو تك تك</title><link rel="stylesheet" href="social.css"><style>body{background:#070910;color:#fff;font-family:Tahoma,Arial,sans-serif;margin:0}.wrap{max-width:1000px;margin:auto;padding:18px 14px 90px}.head,.create,.group{background:#111423;border:1px solid #292d45;border-radius:20px;padding:16px;margin-bottom:14px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head a{color:#cfc8ff;text-decoration:none}.create{display:grid;gap:10px}.create input,.create textarea,.create select{width:100%;box-sizing:border-box;padding:13px;border-radius:13px;border:1px solid #343951;background:#090b13;color:#fff}.create button,.group button{border:0;border-radius:12px;padding:11px 15px;background:#765cff;color:#fff;font-weight:700}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.group{margin:0}.group small{color:#aeb3c7}.bottom{position:fixed;bottom:0;right:0;left:0;display:flex;justify-content:space-around;background:#0d101b;border-top:1px solid #292d45;padding:10px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));z-index:5}.bottom a{color:#d8daea;text-decoration:none;font-size:13px;text-align:center}.msg{min-height:22px;color:#8ee6d8}</style></head><body><script src="auth-guard.js"></script><main class="wrap"><section class="head"><div><h1>👥 المجموعات</h1><p>أنشئ مجموعة عامة أو خاصة واجمع أصدقاءك ومجتمعك.</p></div><a href="taktak.html">الرئيسية</a></section><form class="create" id="createGroup"><h2>＋ إنشاء مجموعة</h2><input id="groupName" required minlength="3" maxlength="120" placeholder="اسم المجموعة"><textarea id="groupDescription" maxlength="3000" placeholder="وصف المجموعة"></textarea><select id="groupPrivacy"><option value="public">🌐 عامة — يمكن للجميع الانضمام</option><option value="private">🔒 خاصة — الانضمام بموافقة الإدارة</option></select><button type="submit">إنشاء المجموعة</button><div class="msg" id="msg"></div></form><section><h2>المجموعات المتاحة</h2><div class="groups" id="groups"><div class="group">جارٍ التحميل…</div></div></section></main><nav class="bottom"><a href="taktak.html">⌂<br>الرئيسية</a><a href="messages.html">💬<br>الشات</a><a href="groups.html">👥<br>المجموعات</a><a href="game-room.html">🎮<br>التحديات</a><a href="profile.html">👤<br>حسابي</a></nav><script src="social-api.js"></script><script>(function(){const box=document.getElementById('groups'),msg=document.getElementById('msg');async function load(){try{const d=await SocialAPI.request('/api/groups');const a=d.groups||[];box.innerHTML=a.length?a.map(g=>`<article class="group"><h3>${g.name}</h3><p>${g.description||'مجموعة شنو منو'}</p><small>${g.privacy==='private'?'🔒 خاصة':'🌐 عامة'} · ${g.memberCount||0} عضو</small><p>${g.joined?'✓ أنت عضو':g.pending?'⏳ طلبك قيد المراجعة':`<button data-join="${g.id}">${g.privacy==='private'?'طلب انضمام':'انضم الآن'}</button>`}</p></article>`).join(''):'<div class="group">لا توجد مجموعات بعد. كن أول من ينشئ مجموعة.</div>'}catch(e){box.innerHTML='<div class="group">'+e.message+'</div>'}}document.getElementById('createGroup').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='جارٍ الإنشاء…';try{await SocialAPI.request('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:groupName.value.trim(),description:groupDescription.value.trim(),privacy:groupPrivacy.value})});e.target.reset();msg.textContent='تم إنشاء المجموعة';load()}catch(x){msg.textContent=x.message}});box.addEventListener('click',async e=>{const b=e.target.closest('[data-join]');if(!b)return;b.disabled=true;try{const d=await SocialAPI.request('/api/groups/'+b.dataset.join+'/join',{method:'POST'});msg.textContent=d.message||'تم';load()}catch(x){msg.textContent=x.message;b.disabled=false}});load()}());</script></body></html>
