<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070910"><title>غرف شنو منو</title><link rel="stylesheet" href="taktak-feed.css"><link rel="stylesheet" href="rooms.css"><link rel="stylesheet" href="room-tools.css"></head><body><script src="auth-guard.js"></script>
<header class="home-top"><nav class="home-nav"><a class="home-brand" href="taktak.html">شنو منو تك تك</a><div class="top-actions"><a href="taktak.html">⌂</a><a href="groups.html">🏠</a><a href="profile.html">👤</a></div></nav></header>
<main class="rooms-shell"><section class="rooms-hero"><div><span class="eyebrow">مجتمع شنو منو</span><h1>غرف الدردشة والبث والتحديات</h1><p>ثلاثة أنواع من الغرف: كتابية، صوتية، وتحديات. كل غرفة يمكن أن تكون عامة أو خاصة، وتحتوي أدوات الإدارة والمشاهدة الجماعية.</p></div><button class="room-button primary" type="button" data-create-toggle>＋ إنشاء غرفة</button></section>
<form class="room-create" hidden data-create-form><h2>إنشاء غرفة جديدة</h2><div class="form-grid"><label>اسم الغرفة<input name="name" required minlength="3" maxlength="120"></label><label>نوع الغرفة<select name="roomType"><option value="text">💬 غرفة كتابية</option><option value="voice">🎙 غرفة صوتية</option><option value="challenge">🏆 غرفة تحديات وبث</option><option value="teacher" hidden data-teacher-option>👩‍🏫 بث معلم حقيقي مجاني</option></select></label><label>الخصوصية<select name="privacy" data-privacy><option value="public">🌐 عامة</option><option value="private">🔒 خاصة</option></select></label><label>طريقة الانضمام<select name="joinApproval" data-join-approval><option value="open">⚡ انضمام مباشر</option><option value="owner_approval">✅ بموافقة صاحب الغرفة</option></select><small data-join-help>يمكن لأي مستخدم الانضمام مباشرة.</small></label><label class="wide">الوصف<textarea name="description" maxlength="3000"></textarea></label><label class="wide legal-check"><input type="checkbox" required name="communityConsent" value="accepted"> أوافق على <a href="community-guidelines.html" target="_blank">قواعد المجتمع والبث</a> وأتحمل مسؤولية المحتوى الذي أنشره.</label></div><div class="form-actions"><button class="room-button primary">إنشاء وفتح الغرفة</button><button class="room-button" type="button" data-create-cancel>إلغاء</button></div></form>
<section class="rooms-toolbar"><button class="filter active" data-filter="all">الكل</button><button class="filter" data-filter="text">💬 كتابية</button><button class="filter" data-filter="voice">🎙 صوتية</button><button class="filter" data-filter="teacher">👩‍🏫 بث المعلمين</button><button class="filter" data-filter="challenge">🏆 تحديات وبث</button></section>
<section class="room-grid" data-rooms><div class="room-card empty">جارٍ تحميل الغرف…</div></section><p class="room-status" data-status></p></main>
<script src="social-api.js"></script><script src="rooms.js"></script></body></html>
