name: Baseline diagnostic tests

on:
  push:
    branches:
      - "diagnostic/baseline-fa541009-20261102"

permissions:
  contents: read

jobs:
  baseline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout original GitHub baseline
        uses: actions/checkout@v4
        with:
          ref: fa541009dd28acb1b70436a7c569840523f0d1a8
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run original test suite
        run: npm test
