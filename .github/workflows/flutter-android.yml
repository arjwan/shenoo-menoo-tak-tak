name: Flutter Android APKs (Shno Mano / Ittisal)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-cloud-build-20261108
    paths:
      - 'mobile/shno_mano/**'
      - 'mobile/ittisal/**'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: write

jobs:
  android:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shno_mano, ittisal]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Verify Flutter project is uploaded
        run: test -f pubspec.yaml && test -f android/app/build.gradle.kts -o -f android/app/build.gradle
      - name: Reject Flutter demo before build
        shell: bash
        run: |
          if grep -Eq 'Flutter Demo Home Page|You have pushed the button this many times|_incrementCounter' lib/main.dart; then
            echo "::error::This project still contains the default Flutter counter demonstration. Refusing to publish a misleading APK."
            exit 1
          fi
      - name: Fetch packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: mobile/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Save APK to private draft release if artifact quota is full
        if: steps.upload.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flutter-debug-${{ github.run_id }}-${{ matrix.app }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Flutter debug ${{ matrix.app }} (run ${{ github.run_id }})" \
            --notes "Unsigned debug APK for internal testing. Created as a draft because Actions artifact storage quota blocked upload." \
            "build/app/outputs/flutter-apk/app-debug.apk#${{ matrix.app }}-debug.apk"
