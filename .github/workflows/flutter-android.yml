name: Flutter Android APKs (Shno Mano / Ittisal)

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which Flutter application to build
        required: true
        default: both
        type: choice
        options:
          - both
          - shno_mano
          - ittisal
  push:
    branches:
      - feature/flutter-cloud-build-20261108
    paths:
      - 'mobile/shno_mano/**'
      - 'mobile/ittisal/**'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: read

jobs:
  android:
    name: Build ${{ matrix.app }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'both' || inputs.app == matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shno_mano, ittisal]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Verify Flutter project is uploaded
        run: test -f pubspec.yaml && test -f android/app/build.gradle.kts -o -f android/app/build.gradle
      - name: Fetch packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: mobile/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
