name: Build original Shno Mano and Ittisal Android Releases

on:
  workflow_dispatch:
  push:
    branches:
      - release/native-shno-ittisal-visual-20261109
    paths:
      - 'android-app/**'
      - 'android/shno-mano-call/**'
      - '.github/workflows/native-shno-ittisal-releases.yml'

permissions:
  contents: write

jobs:
  shno-mano-android:
    name: Shno Mano (existing Android app)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test existing app session routing
        run: node --test tests/entry-session.test.cjs
      - name: Restore existing release signing key
        env:
          SHNO_MANO_KEYSTORE_BASE64: ${{ secrets.SHNO_MANO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SHNO_MANO_KEYSTORE_BASE64"
          printf '%s' "$SHNO_MANO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shno-mano-release.jks"
          test -s "$RUNNER_TEMP/shno-mano-release.jks"
      - name: Build signed original Shno Mano APK
        env:
          SITE_KEYSTORE_PASSWORD: ${{ secrets.SHNO_MANO_KEYSTORE_PASSWORD }}
          SITE_KEY_ALIAS: ${{ secrets.SHNO_MANO_KEY_ALIAS }}
          SITE_KEY_PASSWORD: ${{ secrets.SHNO_MANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SITE_KEYSTORE_PASSWORD"
          test -n "$SITE_KEY_ALIAS"
          test -n "$SITE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/shno-mano-release.jks" \
            -Pandroid.injected.signing.store.password="$SITE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SITE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SITE_KEY_PASSWORD" \
            --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$signer" verify --verbose "$apk"
          cp "$apk" Shno-Mano-2.0.6.apk
          sha256sum Shno-Mano-2.0.6.apk > Shno-Mano-2.0.6.apk.sha256
      - name: Publish Shno Mano signed APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "shno-mano-2.0.6-native-${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "شنو منو Android 2.0.6 (original application)" \
            --notes "Original Android application, retains existing service URLs and functions. Visual theme refresh, no Flutter starter." \
            Shno-Mano-2.0.6.apk Shno-Mano-2.0.6.apk.sha256

  ittisal-android:
    name: Ittisal (existing native Kotlin app)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android/shno-mano-call
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile existing Ittisal Kotlin app
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Restore original release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SHNO_MANO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > shno-mano-release.jks
          test -s shno-mano-release.jks
      - name: Build original signed Ittisal release
        env:
          SHNO_MANO_KEYSTORE_FILE: ../shno-mano-release.jks
          SHNO_MANO_KEYSTORE_PASSWORD: ${{ secrets.SHNO_MANO_KEYSTORE_PASSWORD }}
          SHNO_MANO_KEY_ALIAS: ${{ secrets.SHNO_MANO_KEY_ALIAS }}
          SHNO_MANO_KEY_PASSWORD: ${{ secrets.SHNO_MANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle clean assembleRelease --stacktrace
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$signer" verify --verbose "$apk"
          cp "$apk" Ittisal-1.3.4.apk
          sha256sum Ittisal-1.3.4.apk > Ittisal-1.3.4.apk.sha256
      - name: Publish Ittisal signed APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "ittisal-1.3.4-native-${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "اتصال Android 1.3.4 (original Kotlin application)" \
            --notes "Original Kotlin app, preserves messaging, contacts, calls, and backend API integrations; updated visual palette." \
            Ittisal-1.3.4.apk Ittisal-1.3.4.apk.sha256
