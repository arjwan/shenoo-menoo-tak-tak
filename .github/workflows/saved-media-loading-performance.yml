name: Saved media loading performance
on:
  pull_request:
    paths:
      - 'taktak-feed.js'
      - 'cloudflare/worker.js'
      - 'tests/cloudflare-saved-media-performance.test.mjs'
  push:
    branches: [perf/feed-saved-media-loading-20261107]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check taktak-feed.js
      - run: node --check cloudflare/worker.js
      - run: node --test tests/cloudflare-saved-media-performance.test.mjs
