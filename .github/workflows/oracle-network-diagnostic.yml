name: Oracle connectivity diagnostic
on:
  push:
    branches: [diagnostic/oracle-developer-access-20261103]
    paths: [.github/workflows/oracle-network-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY || secrets.ORACLE_PRIVATE_KEY }}
    steps:
      - name: Compare configured origin and public DNS connectivity
        shell: bash
        run: |
          python3 <<'PY'
          import os,socket,ssl,concurrent.futures,json,urllib.request,urllib.error
          configured=os.environ.get('ORACLE_HOST','').strip()
          public='shino-mino-tak-tak.duckdns.org'
          if not configured: raise SystemExit('Oracle host deployment setting is missing')
          def addresses(host):
              try:return sorted(set(row[4][0] for row in socket.getaddrinfo(host,None,socket.AF_INET,socket.SOCK_STREAM)))
              except Exception:return []
          saved=addresses(configured);current=addresses(public)
          print(json.dumps({'configuredHostResolves':bool(saved),'duckDnsResolves':bool(current),'sameOriginAddress':bool(set(saved)&set(current))}))
          def probe(item):
              label,host,port=item
              try:
                  with socket.create_connection((host,port),timeout=6):pass
                  return {'target':label,'port':port,'reachable':True}
              except Exception as error:return {'target':label,'port':port,'reachable':False,'errorType':type(error).__name__}
          tasks=[(label,host,port) for label,host in [('configuredOracle',configured),('duckDns',public)] for port in [22,80,443]]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(probe,tasks):print(json.dumps(result))
          for label,host in [('configuredOracle',configured),('duckDns',public)]:
              try:
                  with socket.create_connection((host,443),timeout=6) as connection:
                      with ssl.create_default_context().wrap_socket(connection,server_hostname=public) as secure:
                          secure.sendall(('GET /api/health HTTP/1.1\r\nHost: '+public+'\r\nConnection: close\r\n\r\n').encode())
                          line=secure.recv(1024).split(b'\r\n',1)[0].decode(errors='replace')
                          print(json.dumps({'target':label,'tlsHealthStatus':line[:100]}))
              except Exception as error:print(json.dumps({'target':label,'tlsHealthError':type(error).__name__}))
          PY

      - name: Inspect and recover unresponsive web services when SSH is reachable
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/oracle-network"
          key="$RUNNER_TEMP/oracle-network/key"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$key"
          chmod 600 "$key"
          if ! ssh-keyscan -T 25 -H "$ORACLE_HOST" > "$RUNNER_TEMP/oracle-network/known_hosts" 2>/dev/null; then
            echo "Oracle accepts TCP but the SSH handshake did not complete; no service changes were made."
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/oracle-network/known_hosts" ]; then echo "No SSH host key received; no service changes were made."; exit 0; fi
          ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o UserKnownHostsFile="$RUNNER_TEMP/oracle-network/known_hosts" "$ORACLE_USER@$ORACLE_HOST" 'bash -se' <<'REMOTE'
          python3 <<'PY'
          import subprocess,json
          from pathlib import Path
          print(json.dumps({'loadAverage':Path('/proc/loadavg').read_text().split()[:3]}))
          for service in ['nginx','shno-mano-tech.service']:
              r=subprocess.run(['systemctl','show',service,'--property=ActiveState,SubState,MemoryCurrent,TasksCurrent'],capture_output=True,text=True)
              print(json.dumps({'service':service,'state':r.stdout.strip().splitlines()}))
          def health(tls=False):
              command=['curl','--silent','--connect-timeout','3','--max-time','8','-o','/dev/null','-w','%{http_code}']
              if tls:command+=['--resolve','shino-mino-tak-tak.duckdns.org:443:127.0.0.1','https://shino-mino-tak-tak.duckdns.org/api/health']
              else:command+=['http://127.0.0.1:3000/api/health']
              r=subprocess.run(command,capture_output=True,text=True)
              return r.stdout.strip() if r.returncode==0 else 'unresponsive'
          api=health();tls=health(True)
          print(json.dumps({'localApi':api,'localHttps':tls}))
          if api!='200':
              r=subprocess.run(['sudo','-n','systemctl','restart','shno-mano-tech.service'],capture_output=True,text=True)
              print(json.dumps({'apiRestarted':r.returncode==0}))
          if tls!='200':
              test=subprocess.run(['sudo','-n','nginx','-t'],capture_output=True,text=True)
              if test.returncode==0:
                  r=subprocess.run(['sudo','-n','systemctl','restart','nginx'],capture_output=True,text=True)
                  print(json.dumps({'nginxRestarted':r.returncode==0}))
              else:print(json.dumps({'nginxConfigurationValid':False}))
          print(json.dumps({'finalLocalApi':health(),'finalLocalHttps':health(True)}))
          PY
          REMOTE
