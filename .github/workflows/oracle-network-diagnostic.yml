name: Oracle connectivity diagnostic
on:
  push:
    branches: [diagnostic/oracle-developer-access-20261103]
    paths: [.github/workflows/oracle-network-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
    steps:
      - name: Compare configured origin and public DNS connectivity
        shell: bash
        run: |
          python3 <<'PY'
          import os,socket,ssl,concurrent.futures,json,urllib.request,urllib.error
          configured=os.environ.get('ORACLE_HOST','').strip()
          public='shino-mino-tak-tak.duckdns.org'
          if not configured: raise SystemExit('Oracle host deployment setting is missing')
          def addresses(host):
              try:return sorted(set(row[4][0] for row in socket.getaddrinfo(host,None,socket.AF_INET,socket.SOCK_STREAM)))
              except Exception:return []
          saved=addresses(configured);current=addresses(public)
          print(json.dumps({'configuredHostResolves':bool(saved),'duckDnsResolves':bool(current),'sameOriginAddress':bool(set(saved)&set(current))}))
          def probe(item):
              label,host,port=item
              try:
                  with socket.create_connection((host,port),timeout=6):pass
                  return {'target':label,'port':port,'reachable':True}
              except Exception as error:return {'target':label,'port':port,'reachable':False,'errorType':type(error).__name__}
          tasks=[(label,host,port) for label,host in [('configuredOracle',configured),('duckDns',public)] for port in [22,80,443]]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(probe,tasks):print(json.dumps(result))
          for label,host in [('configuredOracle',configured),('duckDns',public)]:
              try:
                  with socket.create_connection((host,443),timeout=6) as connection:
                      with ssl.create_default_context().wrap_socket(connection,server_hostname=public) as secure:
                          secure.sendall(('GET /api/health HTTP/1.1\r\nHost: '+public+'\r\nConnection: close\r\n\r\n').encode())
                          line=secure.recv(1024).split(b'\r\n',1)[0].decode(errors='replace')
                          print(json.dumps({'target':label,'tlsHealthStatus':line[:100]}))
              except Exception as error:print(json.dumps({'target':label,'tlsHealthError':type(error).__name__}))
          PY
