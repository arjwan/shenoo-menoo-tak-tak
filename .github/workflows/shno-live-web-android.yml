name: Shno Mano Android - live website compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-site-auth-live-web-20261109
    paths:
      - 'android-app/**'
      - '.github/workflows/shno-live-web-android.yml'

concurrency:
  group: shno-live-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify live website navigation and preserved app features
        run: node --test tests/live-web-routing.test.cjs tests/contact-picker.test.cjs tests/incoming-call-native.test.cjs tests/call-ringing.test.cjs
      - name: Restore existing release signing certificate
        env:
          SHNO_MANO_KEYSTORE_BASE64: ${{ secrets.SHNO_MANO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SHNO_MANO_KEYSTORE_BASE64"
          printf '%s' "$SHNO_MANO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shno-mano-release.jks"
          test -s "$RUNNER_TEMP/shno-mano-release.jks"
      - name: Build signed existing Shno Mano Android app
        env:
          SITE_KEYSTORE_PASSWORD: ${{ secrets.SHNO_MANO_KEYSTORE_PASSWORD }}
          SITE_KEY_ALIAS: ${{ secrets.SHNO_MANO_KEY_ALIAS }}
          SITE_KEY_PASSWORD: ${{ secrets.SHNO_MANO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SITE_KEYSTORE_PASSWORD"
          test -n "$SITE_KEY_ALIAS"
          test -n "$SITE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/shno-mano-release.jks" \
            -Pandroid.injected.signing.store.password="$SITE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SITE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SITE_KEY_PASSWORD" \
            --no-daemon
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$signer" verify --verbose "$apk"
          cp "$apk" Shno-Mano-2.0.11-live-web.apk
          sha256sum Shno-Mano-2.0.11-live-web.apk > Shno-Mano-2.0.11-live-web.apk.sha256
      - name: Publish signed APK for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "shno-live-web-2.0.11-${{ github.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "شنو منو 2.0.11 - Live Website Compatibility" \
            --notes "Retains original Android app and signing identity. Loads official current website for login and all application functions. Site uses Cloudflare HttpOnly cookie sessions. Test login/navigation on a device before production deployment." \
            Shno-Mano-2.0.11-live-web.apk \
            Shno-Mano-2.0.11-live-web.apk.sha256
