name: Cloudflare package validation (no deployment)

on:
  push:
    branches:
      - migration/cloudflare-oracle-original-20261102
    paths:
      - Dockerfile.cloudflare
      - cloudflare/**
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare-package-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-oracle-original-20261102
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Wrangler configuration and Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/sheno-wrangler-dry-run
      - name: Build original Node application container image
        run: docker build -f Dockerfile.cloudflare -t sheno-meno-cloudflare:validation .
