name: Cloudflare main domain smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-main-domain-smoke.yml'
      - 'cloudflare/**'
      - 'functions/**'
      - 'taktak.html'
      - 'taktak-*.css'
      - 'taktak-layout.js'
      - 'stories.html'
      - 'reels.html'
      - 'reels-v2.js'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify actual Cloudflare API and original social pages
        run: |
          set -eu
          root="https://shenoo-main-cloudflare.pages.dev"
          echo "Cloudflare production Pages API:"
          health="$(curl -fsSL --retry 3 --retry-delay 3 --max-time 25 "$root/api/health")"
          echo "$health"
          echo "$health" | grep -q '"storage":"d1+r2"'
          for route in stories reels; do
            code="$(curl -sSL --max-time 25 -o /tmp/$route.json -w '%{http_code}' "$root/api/$route")"
            echo "GET /api/$route without auth => $code"
            test "$code" = "401"
          done
          curl -fsSL --max-time 25 "$root/taktak.html" | grep -q 'home-colors-scope'
          curl -fsSL --max-time 25 "$root/stories.html" | grep -q "API=window.location.origin"
          curl -fsSL --max-time 25 "$root/reels-v2.js" | grep -q "api('/api/posts'"
          curl -fsSL --max-time 25 "$root/taktak-colors.css" > /dev/null
          echo 'PASS: Cloudflare home, original stories, reels, and authenticated API routing.'
      - name: Diagnose exact signup POST and resolver routing
        shell: bash
        run: |
          set -eu
          for host in https://shinomino.com https://www.shinomino.com https://shenoo-main-cloudflare.pages.dev; do
            echo "=== $host ==="
            curl -sSL --max-time 25 -D /tmp/shenoo-headers -o /tmp/shenoo-body -w 'GET health http=%{http_code} server_ip=%{remote_ip} final=%{url_effective}\n' "$host/api/health"
            grep -Ei '^(server|cf-ray|content-type|location):' /tmp/shenoo-headers || true
            head -c 180 /tmp/shenoo-body; echo
            curl -sSL --max-time 25 -D /tmp/shenoo-headers -o /tmp/shenoo-body -w 'POST signup http=%{http_code} server_ip=%{remote_ip} final=%{url_effective}\n' -H 'Content-Type: application/json' --data '{}' "$host/api/auth/signup"
            grep -Ei '^(server|cf-ray|content-type|location):' /tmp/shenoo-headers || true
            head -c 350 /tmp/shenoo-body; echo
          done
      - name: Inspect public-domain DNS
        if: always()
        run: |
          dig +short NS shinomino.com @1.1.1.1 || true
          dig +short A shinomino.com @1.1.1.1 || true
          curl -sSL --max-time 20 -o /tmp/domain-health -w 'Main domain /api/health status=%{http_code} remote_ip=%{remote_ip}\n' https://shinomino.com/api/health || true
          head -c 250 /tmp/domain-health || true
