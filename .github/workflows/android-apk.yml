name: Build Signed Shno Mano Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, android-call-final-fixes, final-arena-integration ]
    paths:
      - 'android/shno-mano-call/**'
      - 'server/**'
      - 'private-messages.js'
      - 'private-group-call.js'
      - 'messages.html'
      - '.github/workflows/android-apk.yml'

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/shno-mano-call

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Run backend tests
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SHNO_MANO_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > shno-mano-release.jks

      - name: Build signed Release APK
        env:
          SHNO_MANO_KEYSTORE_FILE: ../shno-mano-release.jks
          SHNO_MANO_KEYSTORE_PASSWORD: ${{ secrets.SHNO_MANO_KEYSTORE_PASSWORD }}
          SHNO_MANO_KEY_ALIAS: ${{ secrets.SHNO_MANO_KEY_ALIAS }}
          SHNO_MANO_KEY_PASSWORD: ${{ secrets.SHNO_MANO_KEY_PASSWORD }}
        run: gradle clean assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: shno-mano-call-1.3.0-signed
          path: android/shno-mano-call/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30