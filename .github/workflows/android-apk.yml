name: Build Signed Shno Mano Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, android-call-final-fixes, final-arena-integration ]
    paths:
      - 'android/shno-mano-call/**'
      - 'server/**'
      - 'private-messages.js'
      - 'private-group-call.js'
      - 'messages.html'
      - '.github/workflows/android-apk.yml'

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/shno-mano-call
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run backend tests
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npm test
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.SHNO_MANO_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > shno-mano-release.jks
      - name: Build signed Release APK
        env:
          SHNO_MANO_KEYSTORE_FILE: ../shno-mano-release.jks
          SHNO_MANO_KEYSTORE_PASSWORD: ${{ secrets.SHNO_MANO_KEYSTORE_PASSWORD }}
          SHNO_MANO_KEY_ALIAS: ${{ secrets.SHNO_MANO_KEY_ALIAS }}
          SHNO_MANO_KEY_PASSWORD: ${{ secrets.SHNO_MANO_KEY_PASSWORD }}
        run: gradle clean assembleRelease --stacktrace
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" app/build/outputs/apk/release/Shno-Mano-Ittisal-1.3.0.apk
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: shno-mano-call-1.3.0-signed
          path: android/shno-mano-call/app/build/outputs/apk/release/Shno-Mano-Ittisal-1.3.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct download on Oracle
        working-directory: ${{ github.workspace }}
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          : "${ORACLE_USER:?Missing ORACLE_USER secret}"
          : "${ORACLE_SSH_KEY:?Missing ORACLE_SSH_KEY secret}"
          APK="android/shno-mano-call/app/build/outputs/apk/release/Shno-Mano-Ittisal-1.3.0.apk"
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/oracle_key "$APK" "$ORACLE_USER@$ORACLE_HOST:/tmp/Shno-Mano-Ittisal-1.3.0.apk"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo mkdir -p /usr/share/nginx/html/alarjwan/downloads && sudo install -m 0644 /tmp/Shno-Mano-Ittisal-1.3.0.apk /usr/share/nginx/html/alarjwan/downloads/Shno-Mano-Ittisal-1.3.0.apk && sudo restorecon -F /usr/share/nginx/html/alarjwan/downloads/Shno-Mano-Ittisal-1.3.0.apk 2>/dev/null || true'
          curl --fail --location --silent --show-error --range 0-15 https://alarjwan.duckdns.org/downloads/Shno-Mano-Ittisal-1.3.0.apk >/dev/null
          echo 'ITTISAL_APK_READY=1'
          rm -f ~/.ssh/oracle_key
