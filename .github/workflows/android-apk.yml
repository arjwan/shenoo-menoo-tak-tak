name: Build Shno Mano Call APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/shno-mano-call/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/shno-mano-call

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shno-mano-call-apk
          path: android/shno-mano-call/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
