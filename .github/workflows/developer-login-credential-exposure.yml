name: Developer login credential exposure regression
on:
  push:
    branches: [security/remove-developer-login-prefill-20261107]
  pull_request:
    paths:
      - 'developer/index.html'
      - 'developer-setup.html'
      - 'tests/developer-login-no-prefilled-credentials.test.mjs'
      - '.github/workflows/developer-login-credential-exposure.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/developer-login-no-prefilled-credentials.test.mjs
      - run: bash scripts/build-cloudflare-pages.sh
      - run: "! grep -q 'value=\"shinomino_app\"' dist/developer/index.html"
