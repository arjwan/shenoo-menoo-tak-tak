name: Smart friend existing D1 schema fix
on:
  push:
    branches: [fix/smart-friend-persona-existing-d1-schema-20261106]
  pull_request:
    paths:
      - 'smart-friend-chat.js'
      - 'smart-friend-chat.html'
      - 'cloudflare/migrations/0010_smart_friend_existing_avatar_column.sql'
      - 'tests/smart-friend-existing-schema-fix.test.mjs'
      - '.github/workflows/smart-friend-schema-fix.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check smart-friend-chat.js
      - run: node --test tests/smart-friend-existing-schema-fix.test.mjs
      - run: node --test tests/cloudflare-qr-smart-friend.test.mjs
