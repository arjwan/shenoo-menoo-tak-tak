name: Publish verified standalone call test APK
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Signed APK workflow run
        required: true
      source_commit:
        description: Exact source commit matching the signed call UI
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish-test-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - name: Download and verify the existing signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/call-apk"
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name shno-mano-call-1.5.0-signed --dir "$RUNNER_TEMP/call-apk"
          python scripts/verify-call-apk.py "$RUNNER_TEMP/call-apk/app-release.apk"
          mv "$RUNNER_TEMP/call-apk/app-release.apk" "$RUNNER_TEMP/call-apk/Shno-Mano-Call-1.5.0.apk"
          cd "$RUNNER_TEMP/call-apk"
          sha256sum Shno-Mano-Call-1.5.0.apk > Shno-Mano-Call-1.5.0.apk.sha256
      - name: Publish a direct APK download for live testing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          cat > "$RUNNER_TEMP/call-notes.md" <<'NOTES'
          نسخة اختبار حي 1.5.0 (20)، الحزمة com.shnomano.call.

          القصص والريلز والمجموعات واكتشف والأخبار داخل اتصال، مع اختيار ملفات النشر وتحديث طلبات الأصدقاء بعد العودة.

          وضع نهاري/ليلي، وتوفير بيانات الفيديو، ومجموعات عامة وخاصة وقنوات. مصادر الأخبار والمحتوى الخارجية قد تتأخر أو تتعذر؛ لا تعرض النسخة أخباراً وهمية بديلاً عنها.

          إعداد TURN موجود في الخادم. لا يحتوي APK أسراره. شاشة المكالمة الأصلية محفوظة، مع تحديث مسار جودة الفيديو فقط.

          ثبّت كتحديث دون حذف التطبيق الحالي أو مسح بياناته. هذه نسخة للاختبار الحي؛ لا تعني اكتمال خطة التطوير الشامل، واختبار الهاتفين والخلفية وشاشة القفل ما زال مطلوباً.
          NOTES
          gh release create standalone-call-live-1.5.0 \
            "$RUNNER_TEMP/call-apk/Shno-Mano-Call-1.5.0.apk" \
            "$RUNNER_TEMP/call-apk/Shno-Mano-Call-1.5.0.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --prerelease --latest=false \
            --title 'شنو منو اتصال 1.5.0 — تصميم جديد واستعادة QR' --notes-file "$RUNNER_TEMP/call-notes.md"
