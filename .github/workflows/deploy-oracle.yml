name: Deploy Shno Mano to Oracle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: shno-mano-oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY || secrets.ORACLE_PRIVATE_KEY }}

    steps:
      - name: Verify Oracle deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$RUNNER_TEMP/ssh/oracle_key"
          chmod 600 "$RUNNER_TEMP/ssh/oracle_key"
          ssh-keyscan -H "$ORACLE_HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy main to Oracle
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/oracle_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o TCPKeepAlive=yes \
            "$ORACLE_USER@$ORACLE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          project=/home/opc/shenoo-menoo-tak-tak
          webroot=/usr/share/nginx/html/shno-mano

          test -d "$project/.git"
          cd "$project"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          # Keep production secrets on Oracle. Never replace .env from GitHub.
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          fi

          # Server Arabic voice engine (edge-tts venv, Iraqi neural voices).
          # Always-available local fallback in the TTS provider chain, no API
          # key. Idempotent: safe to run on every deploy.
          mkdir -p /home/opc/.local/tts
          if [ ! -x /home/opc/.local/tts/venv/bin/python3 ]; then
            python3 -m venv /home/opc/.local/tts/venv
          fi
          /home/opc/.local/tts/venv/bin/pip install --quiet --disable-pip-version-check --upgrade edge-tts
          test -x /home/opc/.local/tts/venv/bin/edge-tts

          # Production gate: verify the real teacher TTS provider chain
          # (Groq Orpheus -> local edge-tts -> OpenAI) from this server before
          # publishing/restarting. Uses the same service code as the route.
          # Never prints secrets.
          node server/src/scripts/verify-school-tts.js

          # Publish all root web assets used by the site and games.
          # Remove only retired, verified-unreferenced backup pages. Normal
          # production data and still-linked legacy pages are preserved.
          sudo rm -f \
            "$webroot/school-canva.before-adapter-loader.html" \
            "$webroot/school-canva.before-latest-20260921-034822.html"

          find . -maxdepth 1 -type f \( \
            -name '*.html' -o -name '*.css' -o -name '*.js' -o \
            -name '*.json' -o -name '*.xml' -o -name '*.webmanifest' -o \
            -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o \
            -name '*.webp' -o -name '*.svg' -o -name '*.ico' \
          \) -print0 | while IFS= read -r -d '' file; do
            sudo install -m 0644 "$file" "$webroot/$(basename "$file")"
          done

          # Publish generated virtual teacher portraits under their referenced paths.
          if [ -d school-assets/virtual-teachers ]; then
            find school-assets/virtual-teachers -type f -name '*.svg' -print0 | while IFS= read -r -d '' file; do
              sudo install -D -m 0644 "$file" "$webroot/$file"
            done
          fi

          # The Sumer portal loads its JavaScript and CSS from school/.
          # Preserve the directory structure when deploying the root school.html.
          if [ -d school ]; then
            find school -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -print0 | while IFS= read -r -d '' file; do
              sudo install -D -m 0644 "$file" "$webroot/$file"
            done
          fi

          # Publish the isolated Sumer School PWA without flattening its
          # service-worker scope or mixing its assets with the platform root.
          sudo install -d -m 0755 "$webroot/sumer-school"
          find sumer-school -type d -print0 | while IFS= read -r -d '' dir; do
            relative="${dir#sumer-school}"
            sudo install -d -m 0755 "$webroot/sumer-school$relative"
          done
          find sumer-school -type f -print0 | while IFS= read -r -d '' file; do
            relative="${file#sumer-school/}"
            sudo install -m 0644 "$file" "$webroot/sumer-school/$relative"
          done

          sudo restorecon -RF "$webroot" || true
          sudo systemctl restart shno-mano-tech.service
          sudo systemctl is-active --quiet shno-mano-tech.service
          sudo nginx -t
          sudo systemctl reload nginx
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then break; fi
            if [ "$attempt" -eq 15 ]; then echo "Local health check failed"; exit 1; fi
            sleep 2
          done
          echo
          echo "DEPLOYED_COMMIT=$(git rev-parse --short HEAD)"
          REMOTE

      - name: Verify public production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://shino-mino-tak-tak.duckdns.org/api/health; then
              curl --fail --silent --show-error https://shino-mino-tak-tak.duckdns.org/school.html | grep 'sumer-router.js' >/dev/null
              curl --fail --silent --show-error https://shino-mino-tak-tak.duckdns.org/school/js/sumer-router.js | grep 'ROUTE_CONTRACTS' >/dev/null
              echo
              echo "Oracle automatic deployment passed."
              exit 0
            fi
            sleep 5
          done
          echo "Public health check failed after deployment."
          exit 1
