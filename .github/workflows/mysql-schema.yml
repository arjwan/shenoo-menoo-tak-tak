name: MySQL candidate schema
on:
  push:
    branches: [migration/mysql-iqhosting-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-password
          MYSQL_DATABASE: shinomino_migration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pephemeral-ci-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:mysql
      - run: npm run test:mysql:integration
        env:
          MYSQL_INTEGRATION_TEST: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: shinomino_migration_test
          MYSQL_USER: root
          MYSQL_PASSWORD: ephemeral-ci-password
          MYSQL_SSL_MODE: disabled
