name: Validate Oracle deployment SSH key
on:
  push:
    branches: [diagnostic/oracle-developer-access-20261103]
    paths: [.github/workflows/oracle-ssh-key-check.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    env:
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY || secrets.ORACLE_PRIVATE_KEY }}
    steps:
      - name: Validate key format and report public fingerprint only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ORACLE_SSH_KEY" ]; then echo "SSH private key deployment setting is missing."; exit 1; fi
          directory="$(mktemp -d)"
          trap 'rm -rf "$directory"' EXIT
          chmod 700 "$directory"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$directory/private"
          chmod 600 "$directory/private"
          if ssh-keygen -y -P '' -f "$directory/private" > "$directory/public" 2>"$directory/key-error"; then
            echo "SSH deployment private key is present and its format is valid."
            ssh-keygen -lf "$directory/public" -E sha256 | awk '{print "public_key_fingerprint=" $2; print "public_key_type=" $NF}'
          else
            echo "SSH deployment key could not be parsed with the existing non-interactive configuration."
            exit 1
          fi
