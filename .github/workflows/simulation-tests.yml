name: Simulation batch verification
on:
  push:
    branches: [main]
    paths:
      - 'server/src/simulation/**'
      - 'server/src/scripts/*simulation*'
      - 'server/src/models/**'
      - 'server/test/simulation*'
      - '.github/workflows/simulation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm run test:simulation
      - run: node server/src/scripts/test-simulation-database.js
