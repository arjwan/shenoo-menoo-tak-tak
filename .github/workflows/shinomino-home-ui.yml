name: Shinomino social-first homepage
on:
  push:
    branches: [feat/shinomino-home-approved-design-20261106]
  pull_request:
    paths:
      - 'index.html'
      - 'shinomino-home.css'
      - 'shinomino-home.js'
      - 'tests/shinomino-home-ui.test.mjs'
      - '.github/workflows/shinomino-home-ui.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check shinomino-home.js
      - run: node --test tests/shinomino-home-ui.test.mjs tests/shinomino-login-ui.test.mjs
