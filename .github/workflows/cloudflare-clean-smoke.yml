name: Cloudflare clean Worker smoke
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-clean-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Worker API checks
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shenoo-cloudflare-clean.arjwan307.workers.dev"
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 25 -sS "$BASE/api/health" | tee /tmp/health.json
          python3 -c 'import json; x=json.load(open("/tmp/health.json")); assert x["ok"] and x["service"]=="shenoo-cloudflare-clean-api" and x["storage"]=="d1+r2"'
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 25 -sS "$BASE/api/auth/registration-config" | tee /tmp/config.json
          python3 -c 'import json; x=json.load(open("/tmp/config.json")); assert x["ok"]'
          CODE=$(curl -sS -o /tmp/unauthorized.json -w "%{http_code}" "$BASE/api/users/me")
          test "$CODE" = "401"
          echo "Health, configuration and unauthorized access contract passed"

      - name: Full account and post roundtrip (staging only)
        shell: bash
        run: node cloudflare/tests/live-core-smoke.mjs

      - name: Cloudflare preview UI HTML pages and internal API binding
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shenoo-cloudflare-ui-preview.arjwan307.workers.dev"
          for PAGE in signin.html signup.html taktak.html; do
            curl --fail-with-body --retry 3 --retry-delay 2 --max-time 25 -sS "$BASE/$PAGE" -o /tmp/"$PAGE"
            grep -q "شنو منو تك تك" /tmp/"$PAGE"
          done
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 25 -sS "$BASE/api/health" -o /tmp/ui-health.json
          python3 -c 'import json; x=json.load(open("/tmp/ui-health.json")); assert x["ok"] and x["service"]=="shenoo-cloudflare-clean-api"'
          echo "UI pages and API Service Binding passed"

      - name: Live custom domain HTTP and API routing
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shinomino.com"
          echo "DNS addresses (root and www):"
          getent ahosts shinomino.com || true
          getent ahosts www.shinomino.com || true
          echo "DNS public resolver checks"
          dig +short NS shinomino.com @1.1.1.1 || true
          dig +short A shinomino.com @1.1.1.1 || true
          dig +short AAAA shinomino.com @1.1.1.1 || true
          echo "HTTP response headers and remote address"
          curl -sS -I --max-time 15 -w 'address=%{remote_ip} http=%{http_code}\\n' "$BASE/api/health" || true
          curl --fail-with-body --retry 4 --retry-delay 4 --max-time 30 -sS "$BASE/api/health" -o /tmp/custom-health.json
          python3 -c 'import json; x=json.load(open("/tmp/custom-health.json")); assert x["ok"] and x["service"]=="shenoo-cloudflare-clean-api"'
          curl --fail-with-body --retry 4 --retry-delay 4 --max-time 30 -sS "$BASE/signin.html" -o /tmp/custom-login.html
          grep -q "تسجيل الدخول" /tmp/custom-login.html
          curl --fail-with-body --retry 4 --retry-delay 4 --max-time 30 -sS "https://www.shinomino.com/signup.html" -o /tmp/custom-register.html
          grep -q "إنشاء حساب" /tmp/custom-register.html
          echo "Live domain Cloudflare routing passed"
