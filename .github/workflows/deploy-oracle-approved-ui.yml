name: Verify deployed Oracle frontend
on:
  push:
    branches: [deploy/oracle-approved-ui-20261103]
    paths: ['.github/workflows/deploy-oracle-approved-ui.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Oracle assets and pages
        shell: bash
        run: |
          set -euo pipefail
          oracle_origin='https://shino-mino-tak-tak.duckdns.org'
          for asset in auth-ui.css taktak-colors.css taktak-layout.css taktak-layout.js site-ui.css; do
            curl -fsSL --connect-timeout 15 --max-time 40 "$oracle_origin/$asset" -o "$RUNNER_TEMP/$asset"
            cmp "$asset" "$RUNNER_TEMP/$asset"
            echo "Verified Oracle asset: $asset"
          done
          for page in signin.html signup.html; do
            curl -fsSL --connect-timeout 15 --max-time 40 "$oracle_origin/$page" -o "$RUNNER_TEMP/$page"
            cmp "$page" "$RUNNER_TEMP/$page"
            echo "Verified Oracle page: $page"
          done
          curl -fsSL --connect-timeout 15 --max-time 40 "$oracle_origin/taktak.html" -o "$RUNNER_TEMP/oracle-home.html"
          grep -q 'taktak-layout.css?v=20261103-1' "$RUNNER_TEMP/oracle-home.html"
          grep -q 'data-home-search-results hidden' "$RUNNER_TEMP/oracle-home.html"
          if grep -q 'home-quick-panel' "$RUNNER_TEMP/oracle-home.html"; then exit 1; fi
          for page in settings.html developer.html friends.html; do
            curl -fsSL --connect-timeout 15 --max-time 40 "$oracle_origin/$page" -o "$RUNNER_TEMP/$page"
            grep -q 'site-ui.css?v=20261103-1' "$RUNNER_TEMP/$page"
            grep -q 'shenoo-ui-scope' "$RUNNER_TEMP/$page"
            echo "Verified Oracle theme: $page"
          done
          curl -fsSL --connect-timeout 15 --max-time 40 "$oracle_origin/api/health"
          echo 'Oracle frontend and backend verified'
