name: Standalone Call Stability Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/shno-mano-call/**'
      - '.github/workflows/standalone-call-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-standalone-call:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/shno-mano-call
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK platform
        run: |
          test -n "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile independent Android call app
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
