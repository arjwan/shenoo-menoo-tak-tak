name: Standalone Call Stability Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/shno-mano-call/**'
      - 'call-groups.js'
      - 'cloudflare/call-groups.js'
      - 'private-messages.js'
      - 'call-signaling.js'
      - 'functions/api/**'
      - 'cloudflare/migrations/20261110_call_groups.sql'
      - '.github/workflows/standalone-call-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-call-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-shared-call-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared signaling and group scripts
        run: |
          node --check call-groups.js
          node --check cloudflare/call-groups.js
          node --check call-signaling.js
          node --check private-messages.js
          node --check functions/api/\[\[path\]\].js
      - name: Validate D1 group migration SQL
        run: |
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect(':memory:')
          c.executescript('CREATE TABLE users(id TEXT PRIMARY KEY); CREATE TABLE conversations(id TEXT PRIMARY KEY);')
          c.executescript(open('cloudflare/migrations/20261110_call_groups.sql').read())
          print('D1 group schema syntax OK')
          PY
  compile-standalone-call:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/shno-mano-call
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK platform
        run: |
          test -n "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and package isolated debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload test APK without replacing production installation
        uses: actions/upload-artifact@v4
        with:
          name: shno-mano-call-standalone-debug
          path: android/shno-mano-call/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
