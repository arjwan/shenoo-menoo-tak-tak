name: Build isolated Azawi Worker bundle
on:
  push:
    branches:
      - feat/azawi-d1-rooms-20261107
    paths:
      - 'cloudflare/kahwa-*.js'
      - 'cloudflare/game-engines/**'
      - 'cloudflare/package.json'
      - '.github/workflows/azawi-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/azawi-d1-rooms-20261107
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Build bundle for Cloudflare without deploying
        run: npx --yes wrangler@4.45.0 deploy cloudflare/kahwa-edge.js --name shno-kahwa-games --dry-run --outdir /tmp/azawi-bundle --compatibility-date 2026-11-07 --compatibility-flags nodejs_compat
      - name: Commit bundle to staging branch for verification
        run: |
          set -eu
          mkdir -p cloudflare/kahwa-dist
          SRC="$(find /tmp/azawi-bundle -type f -name '*.js' | head -n 1)"
          test -s "$SRC"
          cp "$SRC" cloudflare/kahwa-dist/worker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/kahwa-dist/worker.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: bundle isolated Azawi Worker for review"
            git push origin HEAD:feat/azawi-d1-rooms-20261107
          fi
