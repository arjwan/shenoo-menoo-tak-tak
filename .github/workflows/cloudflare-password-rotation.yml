name: Cloudflare account password rotation
on:
  push:
    branches:
      - fix/cloudflare-self-service-password-20261106
  pull_request:
    paths:
      - 'functions/api/auth/change-password.js'
      - 'security-password.html'
      - 'tests/cloudflare-password-rotation.test.mjs'
      - '.github/workflows/cloudflare-password-rotation.yml'
jobs:
  secure-password-change:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check functions/api/auth/change-password.js
      - run: node --test tests/cloudflare-password-rotation.test.mjs
      - run: bash scripts/build-cloudflare-pages.sh
