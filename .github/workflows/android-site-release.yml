name: Build Shno Mano Website Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-site-release.yml'

permissions:
  contents: read

jobs:
  build-site-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          SITE_KEYSTORE_BASE64: ${{ secrets.SITE_KEYSTORE_BASE64 }}
        run: |
          test -n "$SITE_KEYSTORE_BASE64"
          printf '%s' "$SITE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shno-mano-release.jks"
          test -s "$RUNNER_TEMP/shno-mano-release.jks"

      - name: Build signed Release APK
        env:
          SITE_KEYSTORE_PASSWORD: ${{ secrets.SITE_KEYSTORE_PASSWORD }}
          SITE_KEY_ALIAS: ${{ secrets.SITE_KEY_ALIAS }}
          SITE_KEY_PASSWORD: ${{ secrets.SITE_KEY_PASSWORD }}
        run: |
          test -n "$SITE_KEYSTORE_PASSWORD"
          test -n "$SITE_KEY_ALIAS"
          test -n "$SITE_KEY_PASSWORD"
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/shno-mano-release.jks" \
            -Pandroid.injected.signing.store.password="$SITE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SITE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SITE_KEY_PASSWORD" \
            --stacktrace

      - name: Verify and rename signed APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" app/build/outputs/apk/release/Shno-Mano-TakTak-2.0.0-release-signed.apk
          sha256sum app/build/outputs/apk/release/Shno-Mano-TakTak-2.0.0-release-signed.apk

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: shno-mano-taktak-2.0.0-release-signed
          path: android-app/app/build/outputs/apk/release/Shno-Mano-TakTak-2.0.0-release-signed.apk
          if-no-files-found: error
          retention-days: 30
