name: Build Shno Mano Website Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-site-release.yml'

permissions:
  contents: read

jobs:
  build-site-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Rename APK
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Shno-Mano-TakTak-2.0.0-release-unsigned.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: shno-mano-taktak-2.0.0-release-unsigned
          path: android-app/app/build/outputs/apk/release/Shno-Mano-TakTak-2.0.0-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
