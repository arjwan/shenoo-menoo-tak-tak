name: Read-only Oracle developer diagnostic
on:
  push:
    branches: [diagnostic/oracle-developer-access-20261103]
    paths: [.github/workflows/oracle-developer-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY || secrets.ORACLE_PRIVATE_KEY }}
    steps:
      - name: Inspect live database identity without revealing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY; do
            if [ -z "${!name:-}" ]; then echo "Missing deployment setting: $name"; exit 1; fi
          done
          install -d -m 700 "$RUNNER_TEMP/oracle-diagnostic"
          key="$RUNNER_TEMP/oracle-diagnostic/key"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -H "$ORACLE_HOST" > "$RUNNER_TEMP/oracle-diagnostic/known_hosts" 2>/dev/null
          ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=15 -o UserKnownHostsFile="$RUNNER_TEMP/oracle-diagnostic/known_hosts" "$ORACLE_USER@$ORACLE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/opc/shenoo-menoo-tak-tak
          pid="$(systemctl show shno-mano-tech.service --property MainPID --value)"
          sudo -n env SHENOO_SERVICE_PID="$pid" node <<'NODE'
          const fs = require('node:fs');
          const project = '/home/opc/shenoo-menoo-tak-tak';
          const pid = process.env.SHENOO_SERVICE_PID;
          let serviceEnvironment = false;
          if (/^[1-9][0-9]*$/.test(pid || '')) {
            const entries = fs.readFileSync('/proc/' + pid + '/environ', 'utf8').split('\0');
            for (const entry of entries) {
              const at = entry.indexOf('=');
              if (at > 0) process.env[entry.slice(0, at)] = entry.slice(at + 1);
            }
            serviceEnvironment = true;
          }
          require(project + '/node_modules/dotenv').config({path: project + '/.env', quiet:true});
          const mongoose = require(project + '/node_modules/mongoose');
          const uri = process.env.MONGODB_URI || process.env.MONGO_URI;
          const route = fs.readFileSync(project + '/server/src/routes/developer.routes.js', 'utf8');
          console.log(JSON.stringify({serviceEnvironment, databaseClient: process.env.DB_CLIENT || 'mongoose-default', mongoConfigured: Boolean(uri), jwtConfigured: Boolean(process.env.JWT_SECRET), routeHasMfa: route.includes('preAuthToken'), routeHasBootstrap: route.includes("'/bootstrap'"), routeUsesMariaDb: route.includes('mariadb')}));
          (async () => {
            if (!uri) return;
            const parsed = new URL(uri);
            await mongoose.connect(uri, {serverSelectionTimeoutMS:10000, maxPoolSize:1});
            const db = mongoose.connection.db;
            const developers = await db.collection('users').find({role:'developer'}, {projection:{username:1,fullName:1,status:1,updatedAt:1}}).limit(10).toArray();
            console.log(JSON.stringify({mongoHost: parsed.hostname, database:db.databaseName, developers}));
            for (const user of developers) {
              const mfa = await db.collection('developermfas').findOne({user:user._id}, {projection:{credentials:1,phoneSecretHash:1}});
              console.log(JSON.stringify({developerId:String(user._id),fidoKeys:mfa?.credentials?.length||0,phonePaired:Boolean(mfa?.phoneSecretHash)}));
            }
          })().catch(error => {console.error(JSON.stringify({diagnosticFailed:true,name:error.name,code:error.code||null}));process.exitCode=1;}).finally(()=>mongoose.disconnect());
          NODE
          REMOTE
