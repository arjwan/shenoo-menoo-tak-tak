<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>غرفة | شنو منو</title><link rel="stylesheet" href="taktak-feed.css"><link rel="stylesheet" href="rooms.css"><link rel="stylesheet" href="social.css"><link rel="stylesheet" href="room-admin.css"><link rel="stylesheet" href="room-tools.css"></head><body><script src="auth-guard.js"></script>
<header class="home-top"><nav class="home-nav"><a class="home-brand" href="groups.html">← الغرف</a><strong data-room-name>جارٍ التحميل…</strong></nav></header>
<main class="rooms-shell room-layout"><section class="room-stage"><div class="privacy-banner" data-privacy-banner>🌐 غرفة عامة — ما تنشره يراه أعضاء الغرفة وقد يُبلغ عنه عند المخالفة.</div>
<section class="room-card"><div class="room-head"><span class="room-badge" data-room-type></span><span class="room-badge" data-room-privacy></span><span class="room-badge" data-live-state></span></div><h1 data-room-title>الغرفة</h1><p data-room-description></p><div class="room-actions"><button class="room-button primary" hidden data-voice-join>🎙 دخول الصوت</button><button class="room-button" hidden data-voice-mute>كتم المايك</button><button class="room-button" hidden data-camera>فتح الكاميرا</button><button class="room-button" hidden data-live-toggle>بدء الغرفة</button><button class="room-button" data-report-room>⚑ تبليغ</button></div></section>
<section class="room-card" data-media-stage hidden><h2>المشاركون على المنصة</h2><div class="speaker-grid" data-speakers></div></section>
<section class="room-card"><div class="chat-messages" data-group-messages></div><form class="chat-composer room-composer" data-group-form><textarea maxlength="5000" placeholder="اكتب في الغرفة…"></textarea><input type="file" hidden data-attachment accept="image/*,video/mp4,video/webm,audio/*"><button class="room-button" type="button" data-attach title="إرسال صورة أو وسائط">📎</button><button class="room-button" type="button" data-emoji title="إضافة سمايل">😊</button><button class="send-button">إرسال</button></form><small class="storage-note">الغرف العامة منشورة وليست محادثات خاصة. لا تشارك أسراراً أو معلومات حساسة.</small></section></section>
<aside class="room-side"><section class="room-card"><h2>الأعضاء</h2><div class="member-list" data-members></div></section><section class="room-card" hidden data-admin-panel><h2>إدارة الغرفة</h2><label class="room-setting"><input type="checkbox" data-setting="isLocked"> قفل دخول الغرفة</label><label class="room-setting"><input type="checkbox" data-setting="allowMemberAudio"> السماح للأعضاء بالمايك</label><label class="room-setting"><input type="checkbox" data-setting="allowMemberVideo"> السماح للأعضاء بالكاميرا</label><label class="room-setting">عدد المتحدثين<input type="number" min="2" max="24" data-setting="maxSpeakers"></label><button class="room-button primary" data-save-settings>حفظ الإعدادات</button><h3>طلبات الانضمام</h3><div class="member-list" data-pending></div><h3>المحظورون</h3><div class="member-list" data-banned></div></section></aside><p class="room-status" data-status></p></main>
<script src="social-api.js"></script><script src="https://shino-mino-tak-tak.duckdns.org/socket.io/socket.io.js"></script><script src="group-room.js"></script></body></html>
