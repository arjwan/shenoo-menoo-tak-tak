<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>تأمين الحساب | شنو منو</title>
<style>body{font-family:system-ui,sans-serif;background:#101827;color:#f4f6ff;min-height:100vh;margin:0;display:grid;place-items:center}main{width:min(92vw,480px);background:#1b2541;border:1px solid #344366;border-radius:18px;padding:28px;box-sizing:border-box}h1{font-size:1.6rem}p{line-height:1.7;color:#bfcbe1}label{display:block;margin:16px 0 6px;font-weight:650}input{box-sizing:border-box;width:100%;border:1px solid #7888b0;border-radius:10px;padding:13px;background:#f5f8ff;color:#15213a;font-size:1rem}button{width:100%;margin-top:22px;background:#6357f4;color:white;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#b9b6ff}#status{min-height:40px;white-space:pre-line}</style></head>
<body><main><h1>تأمين حسابك</h1><p>غيّر كلمة المرور باستخدام جلسة دخولك الحالية. لن تُعرض كلمات المرور أو تُحفظ في المتصفح. بعد التغيير سيتم تسجيل خروج جميع الأجهزة، بما فيها جلسات الإدارة.</p>
<form id="form"><label for="current">كلمة المرور الحالية</label><input id="current" type="password" autocomplete="current-password" required>
<label for="next">كلمة المرور الجديدة (14 حرفًا على الأقل)</label><input id="next" type="password" autocomplete="new-password" minlength="14" maxlength="128" required>
<label for="confirm">تأكيد كلمة المرور الجديدة</label><input id="confirm" type="password" autocomplete="new-password" minlength="14" maxlength="128" required>
<button id="save" type="submit">تغيير كلمة المرور وإغلاق الجلسات</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="/signin.html">العودة إلى تسجيل الدخول</a></p>
</main><script type="module">
const form=document.querySelector('#form'),status=document.querySelector('#status'),button=document.querySelector('#save');
form.addEventListener('submit',async event=>{
 event.preventDefault();status.textContent='';button.disabled=true;
 const currentPassword=document.querySelector('#current').value,newPassword=document.querySelector('#next').value,confirmPassword=document.querySelector('#confirm').value;
 try{
  const response=await fetch('/api/auth/change-password',{method:'POST',credentials:'same-origin',cache:'no-store',redirect:'error',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({currentPassword,newPassword,confirmPassword})});
  const result=await response.json().catch(()=>null);
  status.textContent=result?.message||('تعذر تغيير كلمة المرور ('+response.status+')');
  if(response.ok){form.reset();status.textContent+='\nاستخدم رابط تسجيل الدخول أدناه.';}
 }catch{status.textContent='تعذر الاتصال بخدمة الحسابات، حاول لاحقاً.';}
 finally{document.querySelector('#current').value='';document.querySelector('#next').value='';document.querySelector('#confirm').value='';button.disabled=false;}
});
</script></body></html>
