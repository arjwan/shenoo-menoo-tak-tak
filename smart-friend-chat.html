<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070910">
  <title>صديقي الذكي | شنو منو تك تك</title>
  <link rel="stylesheet" href="taktak-feed.css?v=20260911-1">
  <link rel="stylesheet" href="smart-friend-chat.css?v=20260911-2">
</head>
<body>
<script src="auth-guard.js?v=20260911-2"></script>
<header class="home-top"><nav class="home-nav"><a class="home-brand" href="taktak.html">شنو منو تك تك</a><div class="top-actions"><a href="taal-nsolf.html" title="تعال نسولف">💬</a><a href="taktak.html" title="الرئيسية">⌂</a></div></nav></header>
<main class="sf-studio">
  <aside class="sf-panel sf-personas"><div class="sf-title-row"><h2>شخصياتي</h2><button type="button" data-new-persona>＋</button></div><div data-persona-list></div><p class="sf-note">يمكن إنشاء حتى 10 شخصيات مستقلة، لكل واحدة اسم وعمر ومزاج وأسلوب حوار.</p></aside>
  <section class="sf-panel sf-chat">
    <div class="sf-chat-head"><div class="sf-character" data-character data-emotion="idle"><span class="sf-face">✨</span></div><div><h1 data-friend-name>صديقي الذكي</h1><p data-friend-status>اختر شخصية أو أنشئ واحدة.</p></div></div>
    <div class="sf-messages" data-messages><div class="sf-empty">اختر شخصية وابدأ الحوار.</div></div>
    <div class="sf-preview" data-preview hidden></div>
    <form class="sf-composer" data-chat-form><textarea name="text" maxlength="4000" placeholder="احچي ويا صديقك الذكي…"></textarea><input type="file" data-media accept="audio/*,video/*" hidden><div class="sf-tools"><button type="button" data-record-audio>🎙 صوت</button><button type="button" data-attach>🎥 فيديو/ملف</button><button type="button" data-read-last>🔊 قراءة الرد</button><button class="primary" type="submit">إرسال</button></div></form>
  </section>
  <aside class="sf-panel sf-settings"><h2>إعدادات الشخصية</h2><form data-persona-form><input type="hidden" name="slot"><label>الاسم<input name="name" maxlength="40" required></label><div class="sf-two"><label>الجنس<select name="gender"><option value="male">ذكر</option><option value="female">أنثى</option></select></label><label>العمر<input name="age" type="number" min="18" max="80" value="25"></label></div><label>الشخصية<select name="personality"><option value="friendly">ودود</option><option value="calm">هادئ</option><option value="funny">مرح</option><option value="serious">جدي</option><option value="listener">مستمع</option><option value="educated">مثقف</option></select></label><label>أسلوب الحوار<select name="conversationStyle"><option value="casual">عفوي</option><option value="balanced">متوازن</option><option value="advice">نصيحة ومساعدة</option></select></label><label>الاهتمامات<input name="interests" placeholder="تقنية، شعر، رياضة..."></label><button class="primary full" type="submit">حفظ الشخصية</button></form><hr><h2>حوار جماعي</h2><div data-group-list class="sf-group-list"></div><textarea data-group-text maxlength="4000" placeholder="اكتب موضوع الجولة الجماعية..."></textarea><button class="primary full" type="button" data-group-send>👥 ابدأ الجولة</button><p class="sf-note">اختر شخصيتين أو أكثر. كل شخصية ترد بأسلوبها وترى ردود الشخصيات التي سبقتها في الجولة.</p></aside>
</main>
<script src="smart-friend-chat.js?v=20260911-2"></script>
</body></html>
