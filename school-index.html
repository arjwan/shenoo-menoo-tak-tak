<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرئيسية — شنو منو مدرسة</title>
<link rel="stylesheet" href="school-app.css?v=20260920-1">
<script src="auth-guard.js?v=20260920-1"></script>
</head>
<body>
<div class="school-shell">
<nav class="school-nav" aria-label="تنقل المدرسة">
  <span class="brand">شنو منو مدرسة</span>
  <a href="school-index.html" data-nav="index">الرئيسية</a>
  <a href="school-structure.html" data-nav="structure">الهيكل</a>
  <a href="school-teachers.html" data-nav="teachers">المعلمون</a>
  <a href="school-students.html" data-nav="students">الطلاب</a>
  <a href="school-curriculum.html" data-nav="curriculum">المناهج</a>
  <a href="school-reader.html" data-nav="reader">القارئ</a>
  <a href="school-classroom.html" data-nav="classroom">الحصة</a>
  <a href="school-canva.html">Canva</a>
</nav>

<section class="school-hero">
  <h1>لوحة المدرسة</h1>
  <p id="dash-welcome">جارٍ جلب بياناتك الحقيقية من خادم شنو منو…</p>
  <div class="stats" id="dash-stats"></div>
</section>
<section class="school-panel">
  <h2>الطلاب في حسابك</h2>
  <div id="dash-students" class="grid"></div>
</section>

<div id="page-status" class="empty" hidden></div>
</div>
<script src="school-api-adapter.js?v=20260920-1"></script>
<script src="school-canva-ui.js?v=20260920-1"></script>
<script>
(function(){
  var link=document.querySelector('[data-nav="index"]');
  if(link) link.classList.add('active');
  if(!SchoolUI.requireAuth()) return;
  
SchoolAPI.dashboard().then(function(out){
  var st=document.getElementById("page-status");
  if(!out.ok){ SchoolUI.showError(st, (out.data&&out.data.message)||("HTTP "+out.status)); return; }
  var d=out.data;
  SchoolUI.setText("dash-welcome", "مرحبًا "+((d.user&&d.user.name)||"")+" — الأرقام أدناه من الخادم مباشرة.");
  var stats=d.stats||{};
  var box=document.getElementById("dash-stats");
  [
    ["طلاب", stats.students],
    ["مراحل الكتالوج", stats.stages],
    ["صفوف الكتالوج", stats.grades],
    ["سجلات الكتالوج", stats.catalogBooks],
    ["معرفة موثّقة", stats.verifiedKnowledge],
    ["PDF مفهرس", stats.indexedPdfs],
    ["PDF متاح على الخادم", stats.availablePdfs]
  ].forEach(function(row){
    var el=document.createElement("div"); el.className="stat";
    el.innerHTML="<b>"+String(row[1]==null?0:row[1])+"</b><span>"+row[0]+"</span>";
    box.appendChild(el);
  });
  var list=document.getElementById("dash-students");
  list.innerHTML="";
  (d.students||[]).forEach(function(s){
    list.appendChild(SchoolUI.card(s.name, (s.stage||"")+" · "+(s.grade||"")+(s.section?(" · شعبة "+s.section):"")));
  });
  if(!(d.students||[]).length) list.innerHTML="<div class=\"empty\">لا يوجد طلاب بعد — أضفهم من صفحة الطلاب.</div>";
}).catch(function(e){ SchoolUI.showError(document.getElementById("page-status"), e.message); });

})();
</script>
</body>
</html>
