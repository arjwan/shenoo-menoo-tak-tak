<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>إعلانات شنو منو</title><link rel="stylesheet" href="taktak-feed.css?v=20260910-ads"><style>.ads-shell{width:min(900px,calc(100% - 18px));margin:78px auto 90px}.ads-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.ads-head a{color:inherit;text-decoration:none}.ads-actions{display:flex;gap:8px;flex-wrap:wrap}.ads-actions a{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.ads-actions .primary{background:linear-gradient(135deg,#198cff,#8a5cff);color:#fff;border:0}.ad-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}.ad-badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(255,159,67,.14);color:var(--orange);font-size:12px;font-weight:800}.ad-head{display:flex;gap:10px;align-items:center;padding:14px}.ad-head .meta{min-width:0}.ad-head strong,.ad-head small{display:block}.ad-head small{color:var(--muted);margin-top:3px}.ad-title{font-size:19px;font-weight:900;padding:0 14px 8px}.ad-text{white-space:pre-wrap;line-height:1.9;padding:0 14px 12px}.ad-contact{padding:10px 14px;color:var(--cyan);border-top:1px solid var(--line)}.ad-media img,.ad-media video{width:100%;max-height:560px;object-fit:contain;background:#05070b;display:block}.empty{background:var(--panel);border:1px solid var(--line);border-radius:18px}@media(max-width:650px){.ads-shell{margin-top:66px}.ads-head{align-items:flex-start;flex-direction:column}.ad-media img,.ad-media video{max-height:65vh}}</style></head><body><script src="auth-guard.js"></script><main class="ads-shell"><header class="ads-head"><div><h1>📣 الإعلانات المجانية</h1><p style="color:var(--muted);margin:4px 0">إعلانات المستخدمين بعد موافقة المطور.</p></div><div class="ads-actions"><a href="taktak.html">← الرئيسية</a><a class="primary" href="create-ad.html">＋ إنشاء إعلان مجاني</a></div></header><section id="ads"><div class="empty">جارٍ تحميل الإعلانات...</div></section></main><nav class="mobile-bar"><a href="taktak.html"><b>⌂</b>الرئيسية</a><a href="ads.html"><b>📣</b>الإعلانات</a><a href="reels.html"><b>▶</b>الريلز</a><a href="messages.html"><b>✉</b>الرسائل</a><a href="profile.html"><b>👤</b>حسابي</a></nav><script src="social-api.js"></script><script>(()=>{'use strict';const root=document.getElementById('ads'),esc=v=>String(v||'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])),abs=u=>!u?'':/^https?:/i.test(u)?u:SocialAPI.baseUrl+u,tm=v=>{try{return new Intl.DateTimeFormat('ar-IQ',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return''}};function media(a){const m=a.media&&a.media[0];if(!m)return'';const s=esc(abs(m.url));return '<div class="ad-media">'+(m.type==='video'?'<video controls playsinline preload="metadata" src="'+s+'"></video>':'<img loading="lazy" src="'+s+'" alt="">')+'</div>'}function card(a){const u=a.author||{};return '<article class="ad-card"><div class="ad-head"><span class="avatar">'+esc((u.fullName||u.username||'?').slice(0,1))+'</span><div class="meta"><strong>'+esc(u.fullName||u.username||'مستخدم')+'</strong><small>@'+esc(u.username||'')+' · '+esc(tm(a.createdAt))+'</small></div><span class="ad-badge">إعلان مجاني</span></div><div class="ad-title">'+esc(a.adTitle||'إعلان')+'</div>'+(a.adCategory?'<div style="padding:0 14px 8px;color:var(--muted)">التصنيف: '+esc(a.adCategory)+'</div>':'')+(a.text?'<div class="ad-text">'+esc(a.text)+'</div>':'')+media(a)+(a.adContact?'<div class="ad-contact">للتواصل: '+esc(a.adContact)+'</div>':'')+'</article>'}async function load(){try{const d=await SocialAPI.request('/api/posts/ads');root.innerHTML=(d.ads||[]).length?d.ads.map(card).join(''):'<div class="empty">لا توجد إعلانات معتمدة بعد.</div>'}catch(e){root.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}load()})();</script></body></html>
