<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>مراجعة الإعلانات | شنو منو</title><style>:root{--bg:#070910;--card:#111728;--text:#fff;--muted:#a9b0c3;--line:rgba(255,255,255,.09);--primary:#7c5cff;--danger:#ff5b6e;--success:#39e7ca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{width:min(980px,calc(100% - 20px));margin:24px auto}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:20px}.top{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{color:#fff;text-decoration:none}.card{margin-top:14px;padding:16px}.meta{color:var(--muted);font-size:13px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(255,159,67,.12);color:#ffb15f}.media img,.media video{width:100%;max-height:520px;object-fit:contain;background:#05070b;border-radius:14px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{border:0;border-radius:12px;padding:11px 15px;color:#fff;font-weight:800;cursor:pointer}.approve{background:#168f73}.reject{background:#a83244}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><section class="top"><div><h1>📣 مراجعة الإعلانات</h1><div class="meta">لا يُنشر أي إعلان للمستخدمين قبل الموافقة.</div></div><a href="developer.html">← لوحة المطور</a></section><section id="list"><div class="card empty">جارٍ تحميل الإعلانات...</div></section></main><script>(()=>{'use strict';const API=location.protocol==='file:'?'https://shino-mino-tak-tak.duckdns.org':location.origin,token=localStorage.getItem('developerToken')||'',list=document.getElementById('list'),esc=v=>String(v||'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])),abs=u=>!u?'':/^https?:/i.test(u)?u:API+u;async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+token,Accept:'application/json'}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'تعذر تنفيذ الطلب');return d}function media(a){const m=a.media&&a.media[0];if(!m)return'';const src=esc(abs(m.url));return '<div class="media">'+(m.type==='video'?'<video controls playsinline src="'+src+'"></video>':'<img src="'+src+'" alt="">')+'</div>'}function card(a){const u=a.author||{};return '<article class="card" data-id="'+esc(a.id)+'"><span class="badge">بانتظار الموافقة</span><h2>'+esc(a.adTitle||'إعلان')+'</h2><div class="meta">'+esc(u.fullName||u.username||'مستخدم')+' · @'+esc(u.username||'')+(a.adCategory?' · '+esc(a.adCategory):'')+'</div><p style="white-space:pre-wrap;line-height:1.9">'+esc(a.text||'')+'</p>'+(a.adContact?'<div class="meta">التواصل: '+esc(a.adContact)+'</div>':'')+media(a)+'<div class="actions"><button class="approve" data-decision="approved">✓ موافقة ونشر</button><button class="reject" data-decision="rejected">✕ رفض</button></div></article>'}async function load(){if(!token){list.innerHTML='<div class="card empty">سجل دخول المطور أولًا من لوحة المطور.</div>';return}try{const d=await api('/api/posts/ads/pending');list.innerHTML=(d.ads||[]).length?d.ads.map(card).join(''):'<div class="card empty">لا توجد إعلانات بانتظار المراجعة.</div>'}catch(e){list.innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}}list.onclick=async e=>{const b=e.target.closest('[data-decision]');if(!b)return;const c=b.closest('[data-id]'),decision=b.dataset.decision;let note='';if(decision==='rejected'){note=prompt('سبب الرفض — اختياري:','')||''}b.disabled=true;try{await api('/api/posts/ads/'+c.dataset.id+'/review',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,note})});c.remove();if(!list.querySelector('[data-id]'))list.innerHTML='<div class="card empty">لا توجد إعلانات بانتظار المراجعة.</div>'}catch(err){alert(err.message);b.disabled=false}};load()})();</script></body></html>
