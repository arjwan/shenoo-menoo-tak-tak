<main class="live-create"><section class="live-box">
<div class="live-head"><div><h1>🔴 إنشاء بث مباشر</h1><p>حدد من يستطيع مشاهدة البث قبل تشغيل الكاميرا.</p></div><a href="taktak.html">← الرئيسية</a></div>
<div class="field"><label for="liveTitle">عنوان البث (اختياري)</label><input id="liveTitle" type="text" maxlength="120" placeholder="مثلاً: بث مباشر من شنو منو"></div>
<div class="field"><label>من يستطيع مشاهدة البث؟</label><div class="privacy">
<label><input type="radio" name="visibility" value="public" checked><span><strong>🌍 بث عام</strong><small>يراه جميع مستخدمي شنو منو ويظهر ضمن البثوث المباشرة.</small></span></label>
<label><input type="radio" name="visibility" value="friends"><span><strong>👥 الأصدقاء فقط</strong><small>لا يظهر إلا لأصدقائك.</small></span></label>
<label><input type="radio" name="visibility" value="selected"><span><strong>✓ أشخاص محددون</strong><small>اختر الأشخاص الذين تسمح لهم بالمشاهدة.</small></span></label>
</div></div>
<div class="people" data-selected-people hidden><strong>الأشخاص المسموح لهم</strong><p>سيتم ربط اختيار الأصدقاء هنا بقائمة أصدقاء شنو منو. لا تبدأ الكاميرا قبل التأكيد.</p><a href="friends.html">فتح قائمة الأصدقاء</a></div>
