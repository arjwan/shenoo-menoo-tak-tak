plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shinomeno.taktak'
    compileSdk 37

    defaultConfig {
        applicationId 'com.shinomeno.taktak'
        minSdk 23
        targetSdk 35
        // Rebuild 2.0.0 after the September web and store updates.
        versionCode 20
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
