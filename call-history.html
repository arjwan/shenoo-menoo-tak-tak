<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>سجل المكالمات | شنو منو اتصال</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7fb;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:24px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:14px}
h1{font-size:24px;margin:0}header a{color:#b7c5dc;text-decoration:none;padding:10px 14px;border:1px solid #354057;border-radius:12px}
.subtitle{color:#adbbce;font-size:13px;line-height:1.7;margin:12px 0 20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filters button{border:1px solid #334158;background:#19263b;color:#e6eaf2;padding:11px 16px;border-radius:14px;font:inherit;cursor:pointer}
.filters button[aria-pressed=true]{background:#256e64;border-color:#46bca9}
#history{display:grid;gap:10px}
.call{background:#172135;border:1px solid #303c51;padding:16px;border-radius:18px;display:flex;align-items:center;gap:14px}
.call-icon{font-size:23px;width:42px;height:42px;display:grid;place-items:center;background:#26354d;border-radius:14px;flex-shrink:0}
.call-data{flex:1;min-width:0}.call-data strong{display:block;font-size:15px;overflow-wrap:anywhere}.call-data small{display:block;color:#b5c1d3;font-size:12px;line-height:1.7;margin-top:5px}
.call button{background:#237567;color:white;border:0;border-radius:13px;padding:10px 13px;cursor:pointer}
.unread{color:#ffb7b7}.empty{color:#bfcbdb;text-align:center;padding:35px 12px;border:1px dashed #35445c;border-radius:18px}button:focus-visible,a:focus-visible{outline:3px solid #84dbff;outline-offset:3px}
</style></head><body><main>
<header><h1>📞 سجل المكالمات</h1><a href="messages.html">رجوع للمحادثات</a></header>
<p class="subtitle">جميع مكالماتك الواردة والصادرة والفائتة. السجل خاص بحسابك، ولا يتضمن تسجيلات أو مواقع.</p>
<nav class="filters" aria-label="تصفية المكالمات"><button data-filter="all" aria-pressed="true">الكل</button><button data-filter="incoming" aria-pressed="false">الواردة</button><button data-filter="outgoing" aria-pressed="false">الصادرة</button><button data-filter="missed" aria-pressed="false">الفائتة</button></nav>
<p id="status" role="status" aria-live="polite">جارٍ تحميل سجل المكالمات…</p><section id="history" aria-label="المكالمات"></section>
</main><script src="social-api.js"></script><script src="call-history.js"></script></body></html>
