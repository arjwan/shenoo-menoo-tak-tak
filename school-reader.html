<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قارئ المنهج — شنو منو مدرسة</title>
<link rel="stylesheet" href="school-app.css?v=20260920-1">
<script src="auth-guard.js?v=20260920-1"></script>
</head>
<body>
<div class="school-shell">
<nav class="school-nav" aria-label="تنقل المدرسة">
  <span class="brand">شنو منو مدرسة</span>
  <a href="school-index.html" data-nav="index">الرئيسية</a>
  <a href="school-structure.html" data-nav="structure">الهيكل</a>
  <a href="school-teachers.html" data-nav="teachers">المعلمون</a>
  <a href="school-students.html" data-nav="students">الطلاب</a>
  <a href="school-curriculum.html" data-nav="curriculum">المناهج</a>
  <a href="school-reader.html" data-nav="reader">القارئ</a>
  <a href="school-classroom.html" data-nav="classroom">الحصة</a>
  <a href="school-canva.html">Canva</a>
</nav>

<section class="school-hero"><h1 id="reader-title">قارئ المنهج</h1><p id="reader-meta" class="muted"></p><div id="reader-badge"></div></section>
<section class="school-panel">
  <div id="reader-empty" class="empty" hidden>لا يوجد ملف قابل للقراءة لهذا السجل. الكتالوج قد يدرج العنوان دون PDF محمّل.</div>
  <iframe id="reader-frame" class="reader-frame" title="قراءة المنهج" hidden></iframe>
  <pre id="reader-content" class="empty" hidden style="white-space:pre-wrap"></pre>
</section>

<div id="page-status" class="empty" hidden></div>
</div>
<script src="school-api-adapter.js?v=20260920-1"></script>
<script src="school-canva-ui.js?v=20260920-1"></script>
<script>
(function(){
  var link=document.querySelector('[data-nav="reader"]');
  if(link) link.classList.add('active');
  if(!SchoolUI.requireAuth()) return;
  
var params=new URLSearchParams(location.search);
var id=params.get("id")||"";
if(!id){
  document.getElementById("reader-empty").hidden=false;
  document.getElementById("reader-empty").textContent="اختر كتابًا من صفحة المناهج أولًا (?id=).";
} else {
  SchoolAPI.reader(id).then(function(out){
    if(!out.ok){ SchoolUI.showError(document.getElementById("page-status"), (out.data&&out.data.message)||("HTTP "+out.status)); return; }
    var book=out.data.book||{};
    SchoolUI.setText("reader-title", book.title||"كتاب");
    SchoolUI.setText("reader-meta", [book.stage,book.grade,book.subject,book.availability].filter(Boolean).join(" · "));
    document.getElementById("reader-badge").appendChild(SchoolUI.availabilityBadge(book));
    var url=(book.file&&book.file.url)||book.sourceUrl||"";
    if(out.data.readable && url){
      var frame=document.getElementById("reader-frame"); frame.hidden=false; frame.src=url;
    } else if(book.content){
      var pre=document.getElementById("reader-content"); pre.hidden=false; pre.textContent=book.content;
    } else {
      document.getElementById("reader-empty").hidden=false;
    }
  }).catch(function(e){ SchoolUI.showError(document.getElementById("page-status"), e.message); });
}

})();
</script>
</body>
</html>
