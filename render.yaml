services:
  - type: web
    name: shenoo-menoo-tak-tak
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: shenoo-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false
      - key: REGISTRATION_OTP_REQUIRED
        sync: false
