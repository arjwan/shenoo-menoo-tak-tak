<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070c"><title>الاستشارات | شنو منو</title><link rel="stylesheet" href="taktak-feed.css?v=20260908-3"><style>body{background:#05070c;color:#fff}.consult{max-width:1180px;margin:70px auto 90px;padding:18px}.hero,.apply,.provider{background:#111522;border:1px solid #293149;border-radius:22px;padding:20px}.hero h1{margin:0 0 8px}.hero .lead{line-height:1.8}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.cat{border:1px solid #303954;background:#151a29;color:#fff;border-radius:20px;padding:22px;text-align:center;cursor:pointer;font-weight:800}.cat b{display:block;font-size:34px;margin-bottom:8px}.cat.active{outline:2px solid #66e3c4}.providers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.provider small{opacity:.75}.price{display:inline-block;margin:10px 0;padding:7px 11px;border-radius:999px;background:#202942}.free{background:#15382f}.provider-actions{display:flex;gap:8px;margin-top:10px}.provider-actions a{color:#fff;text-decoration:none;border:1px solid #303954;border-radius:10px;padding:8px 10px}.apply{margin-top:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.apply input,.apply select,.apply textarea{width:100%;box-sizing:border-box;border:1px solid #303954;background:#0b0e17;color:#fff;border-radius:12px;padding:12px}.apply textarea{min-height:100px;grid-column:1/-1}.apply button{border:0;border-radius:12px;background:#66e3c4;padding:12px 18px;font-weight:700;cursor:pointer}.msg{margin-top:10px}.back{color:#fff;text-decoration:none}@media(max-width:760px){.cats{grid-template-columns:repeat(2,1fr)}.providers,.form-grid{grid-template-columns:1fr}}</style></head><body><script src="auth-guard.js?v=20260907-7"></script><main class="consult"><section class="hero"><a class="back" href="taktak.html">← الرئيسية</a><h1>🤝 الاستشارات</h1><p class="lead">اختر الاختصاص أولاً، ثم اختر المختص المعتمد الذي تريده. يمكن لمقدم الخدمة تحديد الاستشارة مجانية أو مدفوعة مع إظهار الأجر بوضوح.</p></section><div class="cats"><button class="cat active" data-cat="medical"><b>🩺</b>طبية</button><button class="cat" data-cat="legal"><b>⚖️</b>قانونية</button><button class="cat" data-cat="educational"><b>🎓</b>تربوية</button><button class="cat" data-cat="psychological"><b>🧠</b>نفسية</button></div><section id="providers" class="providers"><div class="provider">جاري تحميل المختصين…</div></section><section class="apply"><h2>سجّل كمقدم استشارة</h2><p>الطلب يخضع للمراجعة قبل ظهور حسابك للمستخدمين.</p><form id="providerForm"><div class="form-grid"><select name="category" required><option value="medical">طبية</option><option value="legal">قانونية</option><option value="educational">تربوية</option><option value="psychological">نفسية</option></select><input name="title" placeholder="المسمى المهني" maxlength="120" required><input name="specialty" placeholder="الاختصاص الدقيق" maxlength="120" required><select name="serviceType" id="serviceType"><option value="free">مجانية</option><option value="paid">مدفوعة</option></select><input name="fee" id="fee" type="number" min="0" step="1000" placeholder="الأجرة بالدينار العراقي" disabled><textarea name="bio" maxlength="1200" placeholder="نبذة عن الخبرة والخدمة" required></textarea></div><button type="submit">إرسال طلب التسجيل</button><div id="msg" class="msg"></div></form></section></main><nav class="mobile-bar"><a href="taktak.html"><b>⌂</b>الرئيسية</a><a href="friends.html"><b>👥</b>الأصدقاء</a><a href="reels.html"><b>▶</b>المقاطع</a><a href="taal-nsolf.html"><b>💬</b>نسولف</a><a href="profile.html"><b>👤</b>حسابي</a></nav><script src="social-api.js?v=20260907-2"></script><script>(function(){const box=document.getElementById('providers'),form=document.getElementById('providerForm'),msg=document.getElementById('msg'),type=document.getElementById('serviceType'),fee=document.getElementById('fee');let category='medical';const labels={medical:'طبية',legal:'قانونية',educational:'تربوية',psychological:'نفسية'};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){box.innerHTML='<div class="provider">جاري التحميل…</div>';try{const d=await SocialAPI.request('/api/consultations?category='+category);const a=d.providers||[];box.innerHTML=a.length?a.map(p=>{const u=p.user||{},uid=u._id||u.id||'';return '<article class="provider"><h3>'+esc(u.fullName||p.title)+'</h3><small>'+esc(p.specialty)+' · '+labels[p.category]+'</small><p>'+esc(p.bio)+'</p><span class="price '+(p.serviceType==='free'?'free':'')+'">'+(p.serviceType==='free'?'مجانية':Number(p.fee).toLocaleString('ar-IQ')+' د.ع')+'</span><div class="provider-actions">'+(uid?'<a href="profile.html?id='+encodeURIComponent(uid)+'">عرض المختص</a><a href="messages.html?user='+encodeURIComponent(uid)+'">مراسلة</a>':'')+'</div></article>'}).join(''):'<div class="provider">لا يوجد مختصون معتمدون في هذا القسم حتى الآن.</div>'}catch(e){box.innerHTML='<div class="provider">تعذر التحميل: '+esc(e.message)+'</div>'}}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.cat;form.category.value=category;load()});type.onchange=()=>{fee.disabled=type.value!=='paid';fee.required=type.value==='paid';if(type.value==='free')fee.value=''};form.onsubmit=async e=>{e.preventDefault();msg.textContent='جاري الإرسال…';const data=Object.fromEntries(new FormData(form).entries());try{const r=await SocialAPI.request('/api/consultations/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});msg.textContent=r.message||'تم إرسال الطلب للمراجعة';form.reset();fee.disabled=true}catch(err){msg.textContent=err.message}};load()}());</script></body></html>
