<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>تأكيد المطور</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#241b55,#070910 55%);color:#fff;font-family:Tahoma,Arial,sans-serif}.card{width:min(430px,100%);padding:26px;border:1px solid #ffffff1c;border-radius:26px;background:#111728;box-shadow:0 30px 80px #0008;text-align:center}.mark{width:74px;height:74px;display:grid;place-items:center;margin:auto;border-radius:24px;background:linear-gradient(135deg,#7c5cff,#27d8c4);font-size:32px}h1{font-size:24px}p{color:#aeb5c8;line-height:1.9}.btn{width:100%;min-height:50px;border:0;border-radius:15px;background:linear-gradient(135deg,#7c5cff,#27d8c4);color:#fff;font-weight:800;font-size:16px}.ok{color:#75ead6}.bad{color:#ff93a3}</style></head><body><main class="card"><div class="mark">🔐</div><h1>هاتف المطور</h1><p id="message">جارٍ قراءة رمز الاقتران…</p><button class="btn" id="approve" type="button" hidden>الموافقة على دخول المطور</button></main><script>(()=>{'use strict';const API=location.protocol==='file:'?'https://shino-mino-tak-tak.duckdns.org':location.origin,msg=document.getElementById('message'),button=document.getElementById('approve'),params=new URLSearchParams(location.hash.slice(1)),user=params.get('user'),pair=params.get('pair'),challenge=params.get('approve'),key='shnoDeveloperPhone:'+user;if(pair&&user){localStorage.setItem(key,pair);msg.className='ok';msg.textContent='تم اقتران هذا الهاتف بحساب المطور. احتفظ بالهاتف محمياً، ويمكنك الآن مسح رمز الدخول.'}else if(challenge&&user){const secret=localStorage.getItem(key);if(!secret){msg.className='bad';msg.textContent='هذا الهاتف غير مقترن. امسح رمز الاقتران أولاً.'}else{msg.textContent='ورد طلب دخول إلى لوحة المطور. وافق فقط إذا كنت أنت من بدأ تسجيل الدخول.';button.hidden=false;button.onclick=async()=>{button.disabled=true;try{const r=await fetch(API+'/api/developer-mfa/phone/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,challengeId:challenge,secret})}),d=await r.json();if(!r.ok)throw Error(d.message||'تعذر التأكيد');msg.className='ok';msg.textContent='تمت الموافقة. يمكنك العودة إلى شاشة الكمبيوتر.';button.hidden=true}catch(e){msg.className='bad';msg.textContent=e.message;button.disabled=false}}}}else{msg.className='bad';msg.textContent='رمز QR غير صالح.'}})();</script></body></html>
