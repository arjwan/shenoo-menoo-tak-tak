<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>إنشاء إعلان مجاني | شنو منو</title><link rel="stylesheet" href="taktak-feed.css?v=20260910-ads"><style>.ad-shell{width:min(760px,calc(100% - 18px));margin:78px auto 90px}.ad-panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.ad-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.ad-head a{color:inherit;text-decoration:none}.form-grid{display:grid;gap:12px}.form-grid label{font-weight:800}.form-grid input,.form-grid textarea,.form-grid select{width:100%;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:12px;font:inherit}.form-grid textarea{min-height:130px;resize:vertical}.submit{border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,#198cff,#8a5cff);color:#fff;font-weight:900;cursor:pointer}.preview{margin-top:10px;border-radius:16px;overflow:hidden;background:#05070b}.preview img,.preview video{display:block;width:100%;max-height:520px;object-fit:contain}.note{padding:12px;border-radius:12px;background:rgba(255,159,67,.09);color:var(--orange);line-height:1.8}.status{min-height:24px}.ok{color:#3ce5b7}.bad{color:#ff7181}.mine-row{padding:12px;border-bottom:1px solid var(--line)}@media(max-width:650px){.ad-shell{margin-top:66px}.ad-head{align-items:flex-start;flex-direction:column}}</style></head><body><script src="auth-guard.js"></script><main class="ad-shell"><section class="ad-panel"><div class="ad-head"><div><h1>📣 إنشاء إعلان مجاني</h1><p style="margin:4px 0;color:var(--muted)">الإعلان لا يظهر للعامة إلا بعد موافقة المطور.</p></div><a href="ads.html">عرض الإعلانات ←</a></div><div class="note">أضف عنوانًا ووصفًا وصورة أو فيديو ووسيلة تواصل. بعد الإرسال ينتقل الإعلان إلى مراجعة المطور.</div><form id="adForm" class="form-grid"><label>عنوان الإعلان<input id="adTitle" maxlength="120" required placeholder="مثال: عرض خاص على الهواتف"></label><label>التصنيف<select id="adCategory"><option>عام</option><option>متاجر</option><option>خدمات</option><option>عقارات</option><option>سيارات</option><option>وظائف</option><option>أخرى</option></select></label><label>وصف الإعلان<textarea id="adText" maxlength="5000" required placeholder="اكتب تفاصيل الإعلان..."></textarea></label><label>وسيلة التواصل<input id="adContact" maxlength="160" placeholder="هاتف، واتساب، أو أي وسيلة تواصل"></label><label>صورة أو فيديو<input id="adMedia" type="file" accept="image/*,video/mp4,video/webm,video/quicktime"></label><div id="preview" class="preview" hidden></div><button class="submit" type="submit">إرسال الإعلان للمراجعة</button><div id="status" class="status"></div></form></section><section class="ad-panel" style="margin-top:14px"><h2>إعلاناتي</h2><div id="mine">جارٍ التحميل...</div></section></main><nav class="mobile-bar"><a href="taktak.html"><b>⌂</b>الرئيسية</a><a href="ads.html"><b>📣</b>الإعلانات</a><a href="reels.html"><b>▶</b>الريلز</a><a href="messages.html"><b>✉</b>الرسائل</a><a href="profile.html"><b>👤</b>حسابي</a></nav><script src="social-api.js"></script><script>(()=>{'use strict';const form=document.getElementById('adForm'),file=document.getElementById('adMedia'),preview=document.getElementById('preview'),status=document.getElementById('status'),mine=document.getElementById('mine'),esc=v=>String(v||'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));function label(s){return s==='approved'?'✅ معتمد ومنشور':s==='rejected'?'❌ مرفوض':'⏳ بانتظار موافقة المطور'}function row(a){return '<div class="mine-row"><strong>'+esc(a.adTitle||'إعلان')+'</strong><div style="margin-top:6px;color:var(--muted)">'+label(a.adStatus)+(a.adReviewNote?' — '+esc(a.adReviewNote):'')+'</div></div>'}async function loadMine(){try{const d=await SocialAPI.request('/api/posts/ads/mine');mine.innerHTML=(d.ads||[]).length?d.ads.map(row).join(''):'لا توجد إعلانات مرسلة بعد.'}catch(e){mine.textContent=e.message}}file.onchange=()=>{const f=file.files[0];if(!f){preview.hidden=true;preview.innerHTML='';return}const url=URL.createObjectURL(f);preview.innerHTML=f.type.startsWith('video/')?'<video controls playsinline src="'+url+'"></video>':'<img src="'+url+'" alt="">';preview.hidden=false};form.onsubmit=async e=>{e.preventDefault();const b=new FormData();b.append('type','ad');b.append('adTitle',document.getElementById('adTitle').value.trim());b.append('adCategory',document.getElementById('adCategory').value);b.append('adContact',document.getElementById('adContact').value.trim());b.append('text',document.getElementById('adText').value.trim());if(file.files[0])b.append('media',file.files[0]);const btn=form.querySelector('[type=submit]');btn.disabled=true;status.className='status';status.textContent='جارٍ إرسال الإعلان...';try{const d=await SocialAPI.request('/api/posts',{method:'POST',body:b});status.className='status ok';status.textContent=d.message||'تم إرسال الإعلان للمراجعة.';form.reset();preview.hidden=true;preview.innerHTML='';await loadMine()}catch(err){status.className='status bad';status.textContent=err.message}finally{btn.disabled=false}};loadMine()})();</script></body></html>
