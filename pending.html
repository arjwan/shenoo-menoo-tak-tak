<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070910"><title>بانتظار الموافقة | شنو منو تك تك</title><style>:root{--bg:#070910;--line:rgba(255,255,255,.09);--text:#f7f7fb;--muted:#a9adc1;--primary:#7c5cff;--teal:#27d8c4}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 20%,rgba(124,92,255,.2),transparent 35%),radial-gradient(circle at 80% 75%,rgba(39,216,196,.12),transparent 30%),var(--bg)}.card{width:min(620px,100%);padding:34px;border:1px solid var(--line);border-radius:28px;background:rgba(17,20,35,.9);box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}.icon{width:78px;height:78px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;font-size:34px;background:rgba(39,216,196,.1);border:1px solid rgba(39,216,196,.25)}h1{margin:0 0 12px;font-size:30px}p{color:var(--muted);line-height:1.9}.details{margin:22px 0;padding:15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03);text-align:right}.details div{padding:6px 0}.actions{display:grid;gap:10px}.btn{display:block;padding:14px;border-radius:15px;text-decoration:none;font-weight:800}.primary{color:#fff;background:linear-gradient(100deg,var(--primary),#8f63ff)}.secondary{color:#dfe1ea;border:1px solid var(--line)}small{display:block;margin-top:16px;color:var(--muted);line-height:1.8}</style></head><body><main class="card"><div class="icon">✓</div><h1>تم إرسال طلبك</h1><p>تم إنشاء طلب التسجيل بنجاح، والحساب الآن <strong>بانتظار موافقة الإدارة</strong>. بعد الموافقة يمكنك تسجيل الدخول إلى شنو منو تك تك.</p><div class="details" id="details"><div>الحالة: <strong>قيد المراجعة</strong></div></div><div class="actions"><a class="btn primary" href="signin.html">الذهاب إلى تسجيل الدخول</a><a class="btn secondary" href="index.html">العودة إلى الرئيسية</a></div><small>إذا حاولت تسجيل الدخول قبل الموافقة سيخبرك النظام أن الطلب ما زال بانتظار الإدارة.</small></main><script>try{const d=JSON.parse(sessionStorage.getItem('signupPending')||'null');if(d){const el=document.getElementById('details');el.innerHTML='<div>الحالة: <strong>قيد المراجعة</strong></div>'+(d.username?'<div>اسم المستخدم: <strong>@'+String(d.username).replace(/[<>&]/g,'')+'</strong></div>':'')}}catch(e){}</script></body></html>
