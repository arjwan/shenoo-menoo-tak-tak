<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الطلاب — شنو منو مدرسة</title>
<link rel="stylesheet" href="school-app.css?v=20260920-1">
<script src="auth-guard.js?v=20260920-1"></script>
</head>
<body>
<div class="school-shell">
<nav class="school-nav" aria-label="تنقل المدرسة">
  <span class="brand">شنو منو مدرسة</span>
  <a href="school-index.html" data-nav="index">الرئيسية</a>
  <a href="school-structure.html" data-nav="structure">الهيكل</a>
  <a href="school-teachers.html" data-nav="teachers">المعلمون</a>
  <a href="school-students.html" data-nav="students">الطلاب</a>
  <a href="school-curriculum.html" data-nav="curriculum">المناهج</a>
  <a href="school-reader.html" data-nav="reader">القارئ</a>
  <a href="school-classroom.html" data-nav="classroom">الحصة</a>
  <a href="school-canva.html">Canva</a>
</nav>

<section class="school-hero"><h1>طلاب حسابك</h1><p>إنشاء وجلب من <code>/api/school/students</code>.</p></section>
<section class="school-panel">
  <h2>إضافة طالب</h2>
  <form id="student-form" class="toolbar">
    <input name="name" class="field" placeholder="اسم الطالب" required>
    <select name="stage" class="field" required>
      <option value="ابتدائي">ابتدائي</option>
      <option value="متوسط">متوسط</option>
      <option value="إعدادي">إعدادي</option>
    </select>
    <input name="grade" class="field" placeholder="الصف" required>
    <input name="section" class="field" placeholder="الشعبة (اختياري)">
    <button type="submit">حفظ</button>
  </form>
</section>
<section class="school-panel"><div id="students-grid" class="grid"></div></section>

<div id="page-status" class="empty" hidden></div>
</div>
<script src="school-api-adapter.js?v=20260920-1"></script>
<script src="school-canva-ui.js?v=20260920-1"></script>
<script>
(function(){
  var link=document.querySelector('[data-nav="students"]');
  if(link) link.classList.add('active');
  if(!SchoolUI.requireAuth()) return;
  
function loadStudents(){
  return SchoolAPI.students().then(function(out){
    if(!out.ok){ SchoolUI.showError(document.getElementById("page-status"), (out.data&&out.data.message)||("HTTP "+out.status)); return; }
    SchoolUI.clearError(document.getElementById("page-status"));
    var grid=document.getElementById("students-grid"); grid.innerHTML="";
    (out.data.students||[]).forEach(function(s){
      grid.appendChild(SchoolUI.card(s.name, (s.stage||"")+" · "+(s.grade||"")+(s.section?(" · "+s.section):"")+" · جلسات "+((s.progress&&s.progress.sessions)||0)));
    });
    if(!(out.data.students||[]).length) grid.innerHTML="<div class=\"empty\">لا يوجد طلاب بعد.</div>";
  });
}
document.getElementById("student-form").addEventListener("submit", function(e){
  e.preventDefault();
  var fd=new FormData(e.target);
  SchoolAPI.createStudent({
    name: fd.get("name"), stage: fd.get("stage"), grade: fd.get("grade"), section: fd.get("section")||""
  }).then(function(out){
    if(!out.ok){ SchoolUI.showError(document.getElementById("page-status"), (out.data&&out.data.message)||"تعذر الحفظ"); return; }
    e.target.reset(); loadStudents();
  });
});
loadStudents().catch(function(err){ SchoolUI.showError(document.getElementById("page-status"), err.message); });

})();
</script>
</body>
</html>
