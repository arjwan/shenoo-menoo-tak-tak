<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070c"><title>مقاطع تك تك | شنو منو</title><link rel="stylesheet" href="taktak-feed.css?v=20260907c"><style>body{background:#05070c}.reels{max-width:620px;margin:72px auto 90px;padding:12px}.reel-top{position:sticky;top:10px;z-index:8;display:flex;gap:8px;justify-content:space-between;align-items:center;background:#111522e8;padding:12px;border-radius:18px;backdrop-filter:blur(12px)}.reel-top a,.reel-top label,.reel-menu-button{color:#fff;text-decoration:none;background:#262d42;padding:9px 12px;border-radius:12px;cursor:pointer;border:0}.reel-card{height:72vh;min-height:520px;margin:14px 0;border-radius:26px;border:1px solid #262d42;background:linear-gradient(160deg,#151a29,#080a10);display:grid;place-items:center;position:relative;overflow:hidden}.reel-empty{text-align:center;padding:25px}.reel-empty b{font-size:52px;display:block}.reel-actions{position:absolute;left:14px;bottom:22px;display:grid;gap:10px;z-index:3}.reel-action{border:0;border-radius:16px;min-width:58px;min-height:52px;background:#20263ad9;color:#fff;font-size:20px;display:grid;place-items:center;gap:2px;padding:6px;cursor:pointer}.reel-action small{font-size:10px;font-weight:700}.reel-action.is-active{outline:2px solid #fff;background:#39415f}.upload-note{padding:12px;background:#111522;border-radius:15px;margin-top:8px}.reel-side-menu{position:fixed;inset:0;z-index:30;background:#0009;display:none;align-items:stretch;justify-content:flex-start}.reel-side-menu.is-open{display:flex}.reel-side-panel{width:min(340px,88vw);height:100%;background:#0d111c;border-left:1px solid #293049;padding:22px;box-shadow:0 0 40px #0008}.reel-side-panel h2{margin:0 0 18px}.reel-side-panel a,.reel-side-panel button{display:flex;width:100%;box-sizing:border-box;align-items:center;gap:10px;padding:13px 14px;margin:7px 0;border:0;border-radius:14px;background:#171d2d;color:#fff;text-decoration:none;text-align:right;font:inherit;cursor:pointer}.reel-side-close{margin-bottom:16px!important;background:#262d42!important}.gift-sheet{position:absolute;right:12px;left:80px;bottom:20px;z-index:4;background:#0d111ce8;border:1px solid #303750;border-radius:18px;padding:12px;display:none}.gift-sheet.is-open{display:block}.gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gift-grid button{border:0;border-radius:13px;background:#1a2133;color:#fff;padding:10px 5px;font-size:22px;cursor:pointer}.gift-grid small{display:block;font-size:9px;margin-top:4px}@media(max-width:640px){.reels{margin-top:55px;padding:8px}.reel-top strong{font-size:14px}.reel-top a,.reel-top label,.reel-menu-button{padding:8px 9px}.reel-card{height:75vh}.reel-actions{left:9px}.reel-action{min-width:52px;min-height:49px}}</style></head><body><script src="auth-guard.js"></script><main class="reels"><div class="reel-top"><button class="reel-menu-button" type="button" id="openReelMenu" aria-label="فتح القائمة">☰</button><strong>🎬 مقاطع تك تك</strong><label for="clip">＋ إنشاء مقطع</label><input id="clip" type="file" accept="video/mp4,video/webm,video/quicktime" hidden></div><div id="uploadNote" class="upload-note" hidden></div><article class="reel-card"><div class="reel-empty"><b>▶</b><h2>مقاطع قصيرة عمودية</h2><p>ستظهر هنا مقاطع المستخدمين بعد ربط خدمة المقاطع بالخادم.</p></div><div class="reel-actions"><button class="reel-action" type="button" data-reel-action="like" title="إعجاب"><span>♡</span><small>إعجاب</small></button><button class="reel-action" type="button" data-reel-action="comment" title="تعليق"><span>💬</span><small>تعليق</small></button><button class="reel-action" type="button" data-reel-action="save" title="حفظ"><span>🔖</span><small>حفظ</small></button><button class="reel-action" type="button" data-reel-action="share" title="مشاركة"><span>↗</span><small>مشاركة</small></button><button class="reel-action" type="button" data-reel-action="gift" title="إرسال هدية"><span>🎁</span><small>هدية</small></button></div><div class="gift-sheet" id="giftSheet"><strong>إرسال هدية</strong><div class="gift-grid"><button type="button" data-gift="وردة">🌹<small>وردة</small></button><button type="button" data-gift="قلب">❤️<small>قلب</small></button><button type="button" data-gift="تاج">👑<small>تاج</small></button><button type="button" data-gift="نجمة">⭐<small>نجمة</small></button></div></div></article></main><div class="reel-side-menu" id="reelSideMenu" aria-hidden="true"><aside class="reel-side-panel"><button class="reel-side-close" type="button" id="closeReelMenu">✕ إغلاق</button><h2>مقاطع تك تك</h2><a href="taktak.html">⌂ الرئيسية</a><a href="profile.html">👤 حسابي</a><a href="friends.html">👥 الأصدقاء</a><a href="messages.html">💬 الرسائل</a><a href="stories.html">✨ قصتي</a><a href="challenges.html">🏆 التحديات والبث</a><button type="button" data-menu-action="saved">🔖 المقاطع المحفوظة</button><button type="button" data-menu-action="my-reels">🎬 مقاطعي</button><button type="button" data-menu-action="report">⚑ الإبلاغ</button></aside></div><nav class="mobile-bar"><a href="taktak.html"><b>⌂</b>الرئيسية</a><a href="stories.html"><b>✨</b>قصتي</a><a href="reels.html"><b>▶</b>المقاطع</a><a href="taal-nsolf.html"><b>💬</b>نسولف</a><a href="profile.html"><b>👤</b>حسابي</a></nav><script>(function(){const clip=document.getElementById('clip');const note=document.getElementById('uploadNote');const side=document.getElementById('reelSideMenu');const gift=document.getElementById('giftSheet');clip.addEventListener('change',function(){note.hidden=false;note.textContent=this.files[0]?'تم اختيار: '+this.files[0].name+' — جارٍ تجهيز ربط النشر الحقيقي بالخادم ضمن حزمة 1.1.':'لم يتم اختيار مقطع.'});document.getElementById('openReelMenu').onclick=function(){side.classList.add('is-open');side.setAttribute('aria-hidden','false')};document.getElementById('closeReelMenu').onclick=function(){side.classList.remove('is-open');side.setAttribute('aria-hidden','true')};side.addEventListener('click',function(e){if(e.target===side){side.classList.remove('is-open');side.setAttribute('aria-hidden','true')}});document.querySelectorAll('[data-reel-action]').forEach(function(btn){btn.addEventListener('click',async function(){const action=btn.dataset.reelAction;if(action==='like'||action==='save'){btn.classList.toggle('is-active');btn.querySelector('span').textContent=action==='like'?(btn.classList.contains('is-active')?'♥':'♡'):'🔖';return}if(action==='gift'){gift.classList.toggle('is-open');return}if(action==='share'){const url=location.href;try{if(navigator.share)await navigator.share({title:'مقاطع تك تك | شنو منو',url:url});else{await navigator.clipboard.writeText(url);note.hidden=false;note.textContent='تم نسخ رابط المقطع للمشاركة.'}}catch(_){ }return}if(action==='comment'){note.hidden=false;note.textContent='التعليقات ستعمل مع ربط خدمة الريلز بالخادم ضمن حزمة 1.1.'}})});document.querySelectorAll('[data-gift]').forEach(function(btn){btn.onclick=function(){note.hidden=false;note.textContent='تم اختيار هدية '+btn.dataset.gift+' — الإرسال الفعلي سيعمل بعد ربط نظام الهدايا بالحسابات.';gift.classList.remove('is-open')}});document.querySelectorAll('[data-menu-action]').forEach(function(btn){btn.onclick=function(){note.hidden=false;note.textContent='سيتم ربط '+btn.textContent.trim()+' بالخادم ضمن حزمة 1.1.';side.classList.remove('is-open')}})})();</script></body></html>
