<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070c"><title>ريلز تك تك | شنو منو</title><link rel="stylesheet" href="taktak-feed.css?v=20260909-2"><style>body{background:#05070c}.reels{max-width:650px;margin:72px auto 90px;padding:12px}.top{position:sticky;top:8px;z-index:9;display:flex;gap:8px;justify-content:space-between;align-items:center;background:#101914e8;padding:12px;border:1px solid #273a31;border-radius:18px;backdrop-filter:blur(12px)}.top a,.top label,.top button{color:#fff;text-decoration:none;background:#1b2b24;padding:9px 12px;border-radius:12px;cursor:pointer;border:0}.upload{display:none;background:#101914;border:1px solid #273a31;border-radius:18px;padding:14px;margin:10px 0}.upload.open{display:block}.upload textarea,.upload select{width:100%;box-sizing:border-box;background:#07100d;color:#fff;border:1px solid #30443a;border-radius:12px;padding:10px;margin-top:8px}.upload textarea{min-height:70px}.upload video{width:100%;max-height:420px;border-radius:16px;margin-top:10px}.publish{background:#19d9a0!important;color:#03110c!important;font-weight:800}.note{min-height:22px;margin:8px 0}.bad{color:#ff7181}.ok{color:#43e0be}.reel-card{height:76vh;min-height:540px;margin:14px 0;border-radius:26px;border:1px solid #26372f;background:#09100e;position:relative;overflow:hidden}.reel-card video{width:100%;height:100%;object-fit:cover;background:#000}.reel-meta{position:absolute;right:14px;bottom:18px;left:88px;z-index:3;text-shadow:0 2px 8px #000}.owner{display:flex;gap:9px;align-items:center;margin-bottom:8px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#19d9a0;display:grid;place-items:center;color:#04110d}.actions{position:absolute;left:12px;bottom:20px;display:grid;gap:10px;z-index:4}.action{border:0;border-radius:16px;min-width:58px;min-height:54px;background:#15231ddd;color:#fff;font-size:20px;cursor:pointer}.action small{display:block;font-size:10px}.action.active{background:#a62954}.empty{text-align:center;padding:80px 20px;background:#101914;border-radius:22px;margin-top:14px}.muted{opacity:.7}@media(max-width:650px){.reels{padding:7px}.reel-card{height:78vh}.top{top:4px}}</style></head><body><script src="auth-guard.js"></script><main class="reels"><div class="top"><a href="taktak.html">← الرئيسية</a><strong>🎬 ريلز تك تك</strong><button id="create" type="button">＋ إنشاء ريل</button></div><form id="upload" class="upload"><input id="clip" type="file" accept="video/mp4,video/webm,video/quicktime" required><textarea id="caption" maxlength="1000" placeholder="اكتب وصفاً للمقطع..."></textarea><select id="reelVisibility" aria-label="خصوصية الريل"><option value="everyone">🌐 عام</option><option value="friends">👥 الأصدقاء</option><option value="followers">🔔 المتابعون</option><option value="friends_followers">👥🔔 الأصدقاء والمتابعون</option></select><video id="preview" controls playsinline hidden></video><button class="publish top" type="submit">نشر الريل</button><p id="note" class="note muted"></p></form><section id="feed"><div class="empty">جارٍ تحميل الريلز...</div></section></main><nav class="mobile-bar"><a href="taktak.html"><b>⌂</b>الرئيسية</a><a href="stories.html"><b>✨</b>قصتي</a><a href="reels.html"><b>▶</b>الريلز</a><a href="notifications.html"><b>🔔</b>الإشعارات</a><a href="profile.html"><b>👤</b>حسابي</a></nav><script>(()=>{'use strict';const API='https://shino-mino-tak-tak.duckdns.org',token=localStorage.getItem('token')||sessionStorage.getItem('token')||'',feed=document.getElementById('feed'),form=document.getElementById('upload'),clip=document.getElementById('clip'),preview=document.getElementById('preview'),note=document.getElementById('note');const esc=v=>String(v||'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[s])),abs=u=>!u?'':/^https?:/i.test(u)?u:API+u;async function api(p,o={}){o.headers=Object.assign({Authorization:'Bearer '+token,Accept:'application/json'},o.headers||{});const r=await fetch(API+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'تعذر تنفيذ الطلب');return d}document.getElementById('create').onclick=()=>form.classList.toggle('open');clip.onchange=()=>{const f=clip.files[0];if(!f){preview.hidden=true;return}preview.src=URL.createObjectURL(f);preview.hidden=false};function card(r){const u=r.author||{},m=r.media&&r.media[0];if(!m)return'';return '<article class="reel-card" data-id="'+esc(r.id)+'"><video controls playsinline preload="metadata" src="'+esc(abs(m.url))+'"></video><div class="reel-meta"><div class="owner"><span class="avatar">'+esc((u.fullName||'?').slice(0,1))+'</span><strong>'+esc(u.fullName||u.username||'مستخدم')+'</strong></div><div>'+esc(r.text||'')+'</div></div><div class="actions"><button class="action like" type="button">♡<small>'+Number(r.likes||0)+'</small></button><button class="action share" type="button">↗<small>مشاركة</small></button></div></article>'}async function load(){try{const d=await api('/api/reels');const a=d.reels||[];feed.innerHTML=a.length?a.map(card).join(''):'<div class="empty">لا توجد ريلز بعد. كن أول من ينشر مقطعاً.</div>';wireVideos()}catch(e){feed.innerHTML='<div class="empty bad">'+esc(e.message)+'</div>'}}function wireVideos(){const vs=[...feed.querySelectorAll('video')];vs.forEach(v=>v.addEventListener('play',()=>vs.forEach(x=>{if(x!==v)x.pause()})))}form.onsubmit=async e=>{e.preventDefault();if(!clip.files[0])return;const b=new FormData();b.append('media',clip.files[0]);b.append('text',document.getElementById('caption').value.trim());b.append('visibility',document.getElementById('reelVisibility').value);const btn=form.querySelector('[type=submit]');btn.disabled=true;note.className='note muted';note.textContent='جارٍ رفع الريل إلى الخادم...';try{await api('/api/reels',{method:'POST',body:b});note.className='note ok';note.textContent='تم نشر الريل.';form.reset();preview.hidden=true;await load()}catch(err){note.className='note bad';note.textContent=err.message}finally{btn.disabled=false}};feed.onclick=async e=>{const c=e.target.closest('.reel-card');if(!c)return;const like=e.target.closest('.like');if(like){try{const d=await api('/api/reels/'+c.dataset.id+'/like',{method:'POST'});like.classList.toggle('active',d.liked);like.firstChild.nodeValue=d.liked?'♥':'♡';like.querySelector('small').textContent=d.likesCount}catch(err){alert(err.message)}return}if(e.target.closest('.share')){const url=location.origin+location.pathname+'#'+c.dataset.id;try{if(navigator.share)await navigator.share({title:'ريلز تك تك',url});else{await navigator.clipboard.writeText(url);alert('تم نسخ رابط الريل')}}catch(_){}}};load()})();</script></body></html>
