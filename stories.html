<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100d"><title>قصتي | شنو منو تك تك</title><link rel="stylesheet" href="taktak-feed.css?v=20260909-2"><style>
.story-shell{max-width:1040px;margin:82px auto 80px;padding:18px}.panel{background:var(--card,#111522);border:1px solid #26352f;border-radius:22px;padding:18px;margin-bottom:16px}.story-head,.tools,.story-row,.story-owner{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.story-head{justify-content:space-between}.story-head a,.tool{color:inherit;text-decoration:none;background:#182821;border:1px solid #2d4138;padding:10px 14px;border-radius:14px;cursor:pointer}.tools select{color:inherit;background:#182821;border:1px solid #2d4138;padding:10px 14px;border-radius:14px}.publish{background:#19d9a0;color:#04110d;border:0;font-weight:800}.editor{position:relative;min-height:320px;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#111b18,#241535);display:grid;place-items:center;margin:14px 0}.editor img,.editor video{width:100%;max-height:600px;object-fit:contain}.overlay{position:absolute;transform:translate(-50%,-50%);cursor:move;user-select:none;text-shadow:0 2px 8px #000}.story-text{width:100%;box-sizing:border-box;background:#09120f;color:inherit;border:1px solid #30423a;border-radius:14px;padding:12px;min-height:74px}.emoji-box{display:none;gap:8px;flex-wrap:wrap;margin-top:8px}.emoji-box.open{display:flex}.emoji-box button{font-size:24px;background:#17241f;border:0;border-radius:10px;padding:6px;cursor:pointer}.story-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.story-card{position:relative;overflow:hidden;min-height:330px;background:#0c1512;border:1px solid #26352f;border-radius:20px}.story-card img,.story-card video{width:100%;height:330px;object-fit:cover}.story-card .fallback{height:330px;display:grid;place-items:center;padding:24px;font-size:24px}.story-card .story-owner{position:absolute;top:10px;right:10px;left:10px;background:#0009;padding:8px;border-radius:14px}.story-card .caption{position:absolute;bottom:10px;right:10px;left:10px;background:#0009;padding:10px;border-radius:14px}.story-card .render-overlay{position:absolute;transform:translate(-50%,-50%);text-shadow:0 2px 8px #000;pointer-events:none}.story-card audio{width:calc(100% - 20px);position:absolute;bottom:58px;right:10px}.avatar-mini{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#19d9a0;display:grid;place-items:center;color:#04110d}.delete-story{margin-right:auto;background:#a82e3d;color:white;border:0;border-radius:10px;padding:7px 9px;cursor:pointer}.muted{opacity:.72}.status{min-height:24px}.status.ok{color:#45e6b7}.status.bad{color:#ff7685}@media(max-width:700px){.story-shell{margin-top:68px;padding:10px}.editor{min-height:280px}.story-grid{grid-template-columns:1fr}}
</style></head><body><script src="auth-guard.js"></script><main class="story-shell"><section class="panel story-head"><div><h1>✨ قصتي</h1><p class="muted">أنشئ قصة حقيقية تختفي بعد 24 ساعة.</p></div><a href="taktak.html">← الرئيسية</a></section><form class="panel" id="storyForm"><textarea class="story-text" id="storyText" maxlength="1000" placeholder="اكتب نص القصة..."></textarea><input id="storyMedia" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" hidden><input id="storyMusic" type="file" accept="audio/mpeg,audio/mp3,audio/mp4,audio/x-m4a,audio/wav,.mp3,.m4a,.wav" hidden><div class="tools"><label class="tool" for="storyMedia">📷 صورة / فيديو</label><button class="tool" type="button" id="addText">✍️ نص فوق القصة</button><button class="tool" type="button" id="emojiBtn">😊 إيموجي</button><label class="tool" for="storyMusic">🎵 موسيقى</label><label class="tool">الحجم <input id="overlaySize" type="range" min="18" max="72" value="34"></label><select id="storyVisibility" aria-label="خصوصية القصة"><option value="everyone">🌐 عام</option><option value="friends">👥 الأصدقاء</option><option value="followers">🔔 المتابعون</option><option value="friends_followers">👥🔔 الأصدقاء والمتابعون</option></select><button class="publish tool" type="submit">نشر القصة</button></div><div class="emoji-box" id="emojiBox"></div><div class="editor" id="editor"><span class="muted">اختر صورة/فيديو أو أضف نصاً وإيموجي</span></div><div id="musicInfo" class="muted"></div><p id="storyStatus" class="status muted"></p></form><section class="panel"><div class="story-head"><h2>قصصي والقصص المتاحة لي</h2><button class="tool" type="button" id="refresh">↻ تحديث</button></div><div id="storyGrid" class="story-grid"><p class="muted">جارٍ التحميل...</p></div></section></main><nav class="mobile-bar"><a href="taktak.html"><b>⌂</b>الرئيسية</a><a href="stories.html"><b>✨</b>قصتي</a><a href="reels.html"><b>▶</b>المقاطع</a><a href="notifications.html"><b>🔔</b>الإشعارات</a><a href="profile.html"><b>👤</b>حسابي</a></nav><script>
(()=>{'use strict';const API='https://shino-mino-tak-tak.duckdns.org',token=localStorage.getItem('token')||sessionStorage.getItem('token')||'',form=document.getElementById('storyForm'),media=document.getElementById('storyMedia'),music=document.getElementById('storyMusic'),editor=document.getElementById('editor'),status=document.getElementById('storyStatus'),grid=document.getElementById('storyGrid'),size=document.getElementById('overlaySize');let overlays=[],meId='';const esc=v=>String(v||'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])),abs=u=>!u?'':/^https?:/i.test(u)?u:API+u;async function api(p,o={}){o.headers=Object.assign({Authorization:'Bearer '+token,Accept:'application/json'},o.headers||{});const r=await fetch(API+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'تعذر تنفيذ الطلب');return d}function setStatus(t,bad=false){status.textContent=t;status.className='status '+(bad?'bad':'ok')}function renderEditor(){const old=editor.querySelector('img,video');editor.innerHTML='';if(old)editor.appendChild(old);if(!old&&!overlays.length)editor.innerHTML='<span class="muted">اختر صورة/فيديو أو أضف نصاً وإيموجي</span>';overlays.forEach((o,i)=>{const el=document.createElement('span');el.className='overlay';el.textContent=o.value;el.style.left=o.x+'%';el.style.top=o.y+'%';el.style.fontSize=o.size+'px';el.dataset.i=i;editor.appendChild(el);drag(el,o)})}function drag(el,o){let down=false;const move=(x,y)=>{const r=editor.getBoundingClientRect();o.x=Math.max(0,Math.min(100,(x-r.left)/r.width*100));o.y=Math.max(0,Math.min(100,(y-r.top)/r.height*100));el.style.left=o.x+'%';el.style.top=o.y+'%'};el.onpointerdown=e=>{down=true;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(down)move(e.clientX,e.clientY)};el.onpointerup=()=>down=false;el.onclick=()=>{size.value=o.size}}media.onchange=()=>{const f=media.files[0];if(!f)return;const u=URL.createObjectURL(f),el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=u;if(el.tagName==='VIDEO'){el.controls=true;el.playsInline=true}editor.innerHTML='';editor.appendChild(el);overlays.forEach((o,i)=>{const s=document.createElement('span');s.className='overlay';s.textContent=o.value;s.style.left=o.x+'%';s.style.top=o.y+'%';s.style.fontSize=o.size+'px';s.dataset.i=i;editor.appendChild(s);drag(s,o)})};music.onchange=()=>document.getElementById('musicInfo').textContent=music.files[0]?'🎵 '+music.files[0].name:'';document.getElementById('addText').onclick=()=>{const v=prompt('اكتب النص الذي تريد وضعه فوق القصة');if(v&&v.trim()){overlays.push({kind:'text',value:v.trim(),x:50,y:50,size:Number(size.value)});renderEditor()}};const emojis=['😀','😂','😍','🥰','😎','🤩','❤️','🔥','👏','🎉','🇮🇶','☕','🎵','⚽','🌹','✨'];const eb=document.getElementById('emojiBox');eb.innerHTML=emojis.map(e=>'<button type="button">'+e+'</button>').join('');document.getElementById('emojiBtn').onclick=()=>eb.classList.toggle('open');eb.onclick=e=>{if(e.target.tagName==='BUTTON'){overlays.push({kind:'emoji',value:e.target.textContent,x:50,y:50,size:Number(size.value)});renderEditor()}};size.oninput=()=>{const last=overlays[overlays.length-1];if(last){last.size=Number(size.value);renderEditor()}};function storyCard(s){const m=s.media&&s.media[0],u=s.author||{},visual=m?(m.type==='video'?'<video controls playsinline src="'+esc(abs(m.url))+'"></video>':'<img src="'+esc(abs(m.url))+'" alt="">'):'<div class="fallback">'+esc(s.text||'✨')+'</div>',ovs=(s.overlays||[]).map(o=>'<span class="render-overlay" style="left:'+Number(o.x)+'%;top:'+Number(o.y)+'%;font-size:'+Number(o.size)+'px">'+esc(o.value)+'</span>').join(''),aud=s.music&&s.music.url?'<audio controls src="'+esc(abs(s.music.url))+'"></audio>':'';return '<article class="story-card" data-id="'+esc(s.id)+'">'+visual+ovs+aud+'<div class="story-owner"><span class="avatar-mini">'+esc((u.fullName||'?').slice(0,1))+'</span><strong>'+esc(u.fullName||u.username||'مستخدم')+'</strong>'+(String(u.id)===String(meId)?'<button class="delete-story" type="button">حذف</button>':'')+'</div>'+(s.text?'<div class="caption">'+esc(s.text)+'</div>':'')+'</article>'}async function load(){try{const [d,m]=await Promise.all([api('/api/stories'),api('/api/users/me')]);meId=m.user?.id||'';grid.innerHTML=(d.stories||[]).length?d.stories.map(storyCard).join(''):'<p class="muted">لا توجد قصص نشطة الآن.</p>'}catch(e){grid.innerHTML='<p class="status bad">'+esc(e.message)+'</p>'}}form.onsubmit=async e=>{e.preventDefault();const b=new FormData();b.append('text',document.getElementById('storyText').value.trim());b.append('overlays',JSON.stringify(overlays));b.append('visibility',document.getElementById('storyVisibility').value);if(media.files[0])b.append('media',media.files[0]);if(music.files[0]){b.append('music',music.files[0]);b.append('musicName',music.files[0].name)}const btn=form.querySelector('[type=submit]');btn.disabled=true;setStatus('جارٍ رفع القصة إلى الخادم...');try{await api('/api/stories',{method:'POST',body:b});setStatus('تم نشر القصة بنجاح.');form.reset();overlays=[];editor.innerHTML='<span class="muted">اختر صورة/فيديو أو أضف نصاً وإيموجي</span>';document.getElementById('musicInfo').textContent='';await load()}catch(err){setStatus(err.message,true)}finally{btn.disabled=false}};grid.onclick=async e=>{const b=e.target.closest('.delete-story');if(!b)return;const card=b.closest('[data-id]');if(!confirm('حذف هذه القصة؟'))return;try{await api('/api/stories/'+card.dataset.id,{method:'DELETE'});card.remove()}catch(err){alert(err.message)}};document.getElementById('refresh').onclick=load;load()})();
</script></body></html>
