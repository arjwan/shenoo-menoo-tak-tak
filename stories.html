<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>قصتي | شنو منو تك تك</title><link rel="stylesheet" href="taktak-feed.css?v=20260907b"><style>.story-shell{max-width:980px;margin:90px auto 80px;padding:18px}.story-head,.story-create,.story-card{background:#111522;border:1px solid #252b3c;border-radius:22px;padding:18px;margin-bottom:16px}.story-head{display:flex;justify-content:space-between;align-items:center}.story-head a,.story-create label{color:#fff;text-decoration:none;background:#262d42;padding:10px 15px;border-radius:14px}.story-create textarea{width:100%;min-height:90px;box-sizing:border-box;margin:12px 0;padding:12px;border-radius:14px;background:#090c14;color:#fff;border:1px solid #30384d}.story-actions{display:flex;gap:10px;flex-wrap:wrap}.story-actions button,.story-actions label{border:0;cursor:pointer}.story-preview{max-width:100%;max-height:520px;border-radius:18px;display:block;margin-top:12px}.muted{opacity:.7}</style></head><body><script src="auth-guard.js"></script><main class="story-shell"><section class="story-head"><div><h1>✨ قصتي</h1><p class="muted">شارك لحظتك بصورة أو فيديو قصير.</p></div><a href="taktak.html">← الرئيسية</a></section><form class="story-create" id="storyForm"><textarea id="storyText" maxlength="1000" placeholder="اكتب شيئاً مع قصتك..."></textarea><input id="storyMedia" type="file" accept="image/*,video/mp4,video/webm" hidden><div class="story-actions"><label for="storyMedia">📷 صورة / فيديو</label><button class="tool-btn publish" type="submit">نشر القصة</button></div><div id="preview"></div><p id="storyStatus" class="muted">سيتم ربط النشر بخدمة القصص في الخادم؛ لن نعرض نجاحاً وهمياً.</p></form><section><h2>قصص الأصدقاء</h2><div class="story-card"><p class="muted">لا توجد قصص محمّلة بعد.</p></div></section></main><nav class="mobile-bar"><a href="taktak.html"><b>⌂</b>الرئيسية</a><a href="stories.html"><b>✨</b>قصتي</a><a href="reels.html"><b>▶</b>المقاطع</a><a href="taal-nsolf.html"><b>💬</b>نسولف</a><a href="profile.html"><b>👤</b>حسابي</a></nav><script>const media=document.getElementById('storyMedia'),preview=document.getElementById('preview'),statusEl=document.getElementById('storyStatus');media.addEventListener('change',()=>{preview.innerHTML='';const f=media.files[0];if(!f)return;const u=URL.createObjectURL(f),el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=u;el.className='story-preview';if(el.tagName==='VIDEO'){el.controls=true;el.playsInline=true}preview.appendChild(el)});document.getElementById('storyForm').addEventListener('submit',e=>{e.preventDefault();statusEl.textContent='خدمة نشر القصص قيد الربط بالخادم؛ لم يتم إرسال محتوى وهمي.'});</script></body></html>
