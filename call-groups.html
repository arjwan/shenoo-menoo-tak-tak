<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مجموعات شنو منو اتصال</title><link rel="stylesheet" href="mall.css"><link rel="stylesheet" href="social.css"><style>
body{background:#101320;color:#fafafa;font-family:Tahoma,Arial,sans-serif;margin:0}.group-shell{max-width:1000px;margin:auto;padding:18px}.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.group-head a{color:#d6f7ee}.group-card{background:#1c2032;padding:16px;border-radius:18px;margin:12px 0}.group-form{display:grid;gap:10px}.group-form input,.group-form textarea{width:100%;box-sizing:border-box;min-height:44px;border-radius:10px;border:1px solid #5b6171;background:#161a2a;color:white;padding:10px}button{font:inherit;cursor:pointer}button:disabled{opacity:.5}.group-btn{background:#32394d;color:#fff;border:1px solid #576178;padding:12px;border-radius:12px}.group-btn.primary{background:#167963}.group-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.group-list{display:grid;gap:8px}.group-list button{text-align:right}.group-msgs{height:min(42vh,400px);overflow:auto;background:#131727;padding:12px;border-radius:14px}.group-msg{margin:8px 0;padding:9px;border-radius:12px;background:#28304a}.group-msg.mine{background:#135747}.group-msg small{display:block;opacity:.7;margin-bottom:5px}.group-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.group-tile{border-radius:14px;background:#0e101a;min-height:125px;position:relative;overflow:hidden}.group-tile video{display:block;width:100%;height:190px;object-fit:cover}.group-tile span{position:absolute;right:8px;bottom:8px;background:#111b;padding:5px;border-radius:8px}.group-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.group-controls button{border-radius:50px;padding:12px}.group-controls .end{background:#b52438}.group-alert{background:#44342a;padding:14px;border-radius:14px}#group-stage[hidden],#group-invite[hidden],#group-room[hidden],#group-create[hidden]{display:none!important}label{display:block;margin:8px 0}small{opacity:.8}
</style></head><body><script src="auth-guard.js"></script><div class="group-shell"><div class="group-head"><h2>مجموعات شنو منو اتصال</h2><a href="calls.html">العودة للاتصال</a></div><div id="group-list" class="group-card"><div class="group-row"><button class="group-btn primary" id="group-new">＋ مجموعة جديدة</button><button class="group-btn" id="group-refresh">تحديث</button></div><div class="group-list" id="group-items"></div></div><div id="group-create" class="group-card" hidden><h3>إنشاء مجموعة خاصة</h3><form id="group-create-form" class="group-form"><input id="group-name" required minlength="2" maxlength="80" placeholder="اسم المجموعة"><div id="group-contacts"></div><button class="group-btn primary">إنشاء المجموعة</button></form></div><section id="group-room" class="group-card" hidden><div class="group-head"><h3 id="group-title"></h3><button class="group-btn" id="group-back">المجموعات</button></div><div id="group-members"></div><div class="group-msgs" id="group-messages"></div><form id="group-send" class="group-row"><input id="group-text" maxlength="5000" required placeholder="اكتب رسالة للمجموعة…" style="flex:1"><button class="group-btn primary">إرسال</button></form><div class="group-row"><button class="group-btn primary" id="group-start-audio">☎ مكالمة صوتية جماعية</button><button class="group-btn primary" id="group-start-video">📹 مكالمة فيديو جماعية</button><button class="group-btn" id="group-add">＋ إضافة عضو</button></div></section><div id="group-invite" class="group-alert" hidden><p id="group-invite-text">دعوة مكالمة جماعية</p><button class="group-btn primary" id="group-accept">قبول</button><button class="group-btn" id="group-reject">رفض</button></div><div id="group-stage" class="group-card" hidden><h3 id="group-call-status">تجهيز الاتصال…</h3><div class="group-tiles" id="group-tiles"></div><div class="group-controls"><button class="group-btn" id="group-mute">🎙 كتم</button><button class="group-btn" id="group-video">📹 فيديو/صوت</button><button class="group-btn
